name: Backend CI

on:
  pull_request:
  push:
    branches: [main, 'feat/#38-evidence-integrity-gate', 'feat/#40-evidence-preservation-gate', 'feat/#42-approval-request-binding', 'feat/#44-approval-review-decision', 'feat/#46-official-pdf-issuance']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java21-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
      - name: Build and run default regression tests
        run: bash ./gradlew build --rerun-tasks --no-daemon
      - name: Check skipped tests and reasons
        run: python3 .github/scripts/check_junit_results.py core

  mysql8-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_DATABASE: td_issue32_ci
          MYSQL_ROOT_PASSWORD: synthetic_ci_only_password
        ports:
          - 13307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TD_ISSUE32_MYSQL_URL: jdbc:mysql://127.0.0.1:13307/td_issue32_ci?useSSL=false&allowPublicKeyRetrieval=true
      TD_ISSUE32_MYSQL_USER: root
      TD_ISSUE32_MYSQL_PASSWORD: synthetic_ci_only_password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
      - name: Apply migration to fresh MySQL 8 schema
        run: bash ./gradlew test --tests '*FanReportMigrationMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm migration test ran
        run: python3 .github/scripts/check_junit_results.py mysql-migration
      - name: Apply W04 Case migration to existing MySQL data
        run: bash ./gradlew test --tests '*CaseMigrationMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W04 migration test ran
        run: python3 .github/scripts/check_junit_results.py case-migration
      - name: Apply W05 snapshot and draft migration
        run: bash ./gradlew test --tests '*CaseW05MigrationMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W05 migration test ran
        run: python3 .github/scripts/check_junit_results.py case-w05-migration
      - name: Apply W06 evidence verification migration
        run: bash ./gradlew test --tests '*CaseW06MigrationMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W06 migration test ran
        run: python3 .github/scripts/check_junit_results.py case-w06-migration
      - name: Apply W07 preservation migration
        run: bash ./gradlew test --tests '*CaseW07MigrationMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W07 migration test ran
        run: python3 .github/scripts/check_junit_results.py case-w07-migration
      - name: Apply W08a approval request migration
        run: bash ./gradlew test --tests '*CaseW08aMigrationMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W08a migration test ran
        run: python3 .github/scripts/check_junit_results.py case-w08a-migration
      - name: Apply W08b approval review and decision migration
        run: bash ./gradlew test --tests '*CaseW08bMigrationMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W08b migration test ran
        run: python3 .github/scripts/check_junit_results.py case-w08b-migration
      - name: Apply W09 official PDF issuance migration
        run: bash ./gradlew test --tests '*CaseW09MigrationMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W09 migration test ran
        run: python3 .github/scripts/check_junit_results.py case-w09-migration
      - name: Validate JPA schema and MySQL behavior
        run: bash ./gradlew test --tests '*FanReportSchemaValidateMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm schema tests ran
        run: python3 .github/scripts/check_junit_results.py mysql-schema
      - name: Validate W05 JPA mappings
        run: bash ./gradlew test --tests '*CaseW05SchemaValidateMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W05 schema test ran
        run: python3 .github/scripts/check_junit_results.py case-w05-schema
      - name: Verify W05 snapshot and draft concurrency
        run: bash ./gradlew test --tests '*CaseW05ConcurrentMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W05 concurrency tests ran
        run: python3 .github/scripts/check_junit_results.py case-w05-concurrency
      - name: Validate W06 verification JPA mapping
        run: bash ./gradlew test --tests '*CaseW06SchemaValidateMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W06 schema test ran
        run: python3 .github/scripts/check_junit_results.py case-w06-schema
      - name: Validate W07 preservation JPA mappings
        run: bash ./gradlew test --tests '*CaseW07SchemaValidateMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W07 schema test ran
        run: python3 .github/scripts/check_junit_results.py case-w07-schema
      - name: Validate W08a approval request JPA mappings
        run: bash ./gradlew test --tests '*CaseW08aSchemaValidateMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W08a schema test ran
        run: python3 .github/scripts/check_junit_results.py case-w08a-schema
      - name: Validate W08b review receipt and decision JPA mappings
        run: bash ./gradlew test --tests '*CaseW08bSchemaValidateMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W08b schema test ran
        run: python3 .github/scripts/check_junit_results.py case-w08b-schema
      - name: Validate W09 official PDF JPA mappings
        run: bash ./gradlew test --tests '*CaseW09SchemaValidateMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W09 schema test ran
        run: python3 .github/scripts/check_junit_results.py case-w09-schema
      - name: Verify W06 idempotency and activity rollback on MySQL
        run: bash ./gradlew test --tests '*CaseW06ConcurrentMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W06 MySQL concurrency tests ran
        run: python3 .github/scripts/check_junit_results.py case-w06-concurrency
      - name: Verify W07 idempotency policy race and rollback on MySQL
        run: bash ./gradlew test --tests '*CaseW07ConcurrentMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W07 MySQL concurrency tests ran
        run: python3 .github/scripts/check_junit_results.py case-w07-concurrency
      - name: Verify W08a idempotency concurrency and rollback on MySQL
        run: bash ./gradlew test --tests '*CaseW08aConcurrentMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W08a MySQL concurrency tests ran
        run: python3 .github/scripts/check_junit_results.py case-w08a-concurrency
      - name: Verify W08b decision, receipt and withdrawal concurrency on MySQL
        run: bash ./gradlew test --tests '*CaseW08bConcurrentMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W08b MySQL concurrency tests ran
        run: python3 .github/scripts/check_junit_results.py case-w08b-concurrency
      - name: Verify W09 official PDF issuance concurrency on MySQL
        run: bash ./gradlew test --tests '*CaseW09ConcurrentMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W09 MySQL concurrency tests ran
        run: python3 .github/scripts/check_junit_results.py case-w09-concurrency
      - name: Validate W05 mappings after concurrency data
        run: bash ./gradlew test --tests '*CaseW05SchemaValidateMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm order-independent W05 schema test ran
        run: python3 .github/scripts/check_junit_results.py case-w05-schema
      - name: Verify W04 optimistic locking on MySQL
        run: bash ./gradlew test --tests '*CaseConcurrentMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W04 concurrency test ran
        run: python3 .github/scripts/check_junit_results.py case-concurrency
      - name: Verify Track 1 concurrent MySQL writes
        env:
          TD_MYSQL_MIGRATION_URL: jdbc:mysql://127.0.0.1:13307/td_issue32_ci?useSSL=false&allowPublicKeyRetrieval=true
          TD_MYSQL_MIGRATION_USER: root
          TD_MYSQL_MIGRATION_PASSWORD: synthetic_ci_only_password
        run: bash ./gradlew test --tests '*Track1ConcurrentMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm Track 1 concurrency test ran
        run: python3 .github/scripts/check_junit_results.py track1-concurrency

  mysql8-track1-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_DATABASE: td_track1_ci
          MYSQL_ROOT_PASSWORD: synthetic_ci_only_password
        ports:
          - 13307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TD_MYSQL_MIGRATION_URL: jdbc:mysql://127.0.0.1:13307/td_track1_ci?useSSL=false&allowPublicKeyRetrieval=true
      TD_MYSQL_MIGRATION_USER: root
      TD_MYSQL_MIGRATION_PASSWORD: synthetic_ci_only_password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
      - name: Verify Track 1 legacy migration
        run: bash ./gradlew test --tests '*Track1TenantMigrationMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm Track 1 migration test ran
        run: python3 .github/scripts/check_junit_results.py track1-migration

  minio-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_DATABASE: td_issue32_minio_ci
          MYSQL_ROOT_PASSWORD: synthetic_ci_only_password
        ports:
          - 13307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TD_ISSUE32_MYSQL_URL: jdbc:mysql://127.0.0.1:13307/td_issue32_minio_ci?useSSL=false&allowPublicKeyRetrieval=true
      TD_ISSUE32_MYSQL_USER: root
      TD_ISSUE32_MYSQL_PASSWORD: synthetic_ci_only_password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
      - name: Build pinned MinIO test image
        run: docker build --file .github/docker/minio-ci.Dockerfile --tag td-issue32-minio-ci:local .
      - name: Start private MinIO test bucket
        run: bash .github/scripts/start_minio_ci.sh
      - name: Apply migration to fresh MySQL 8 schema
        run: bash ./gradlew test --tests '*FanReportMigrationMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm migration test ran
        run: python3 .github/scripts/check_junit_results.py mysql-migration
      - name: Apply W04 Case migration to existing MySQL data
        run: bash ./gradlew test --tests '*CaseMigrationMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W04 migration test ran
        run: python3 .github/scripts/check_junit_results.py case-migration
      - name: Apply W05 snapshot and draft migration
        run: bash ./gradlew test --tests '*CaseW05MigrationMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W05 migration test ran
        run: python3 .github/scripts/check_junit_results.py case-w05-migration
      - name: Apply W06 evidence verification migration
        run: bash ./gradlew test --tests '*CaseW06MigrationMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W06 migration test ran
        run: python3 .github/scripts/check_junit_results.py case-w06-migration
      - name: Apply W07 preservation migration
        run: bash ./gradlew test --tests '*CaseW07MigrationMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W07 migration test ran
        run: python3 .github/scripts/check_junit_results.py case-w07-migration
      - name: Apply W08a approval request migration
        run: bash ./gradlew test --tests '*CaseW08aMigrationMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W08a migration test ran
        run: python3 .github/scripts/check_junit_results.py case-w08a-migration
      - name: Apply W08b approval review and decision migration
        run: bash ./gradlew test --tests '*CaseW08bMigrationMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W08b migration test ran
        run: python3 .github/scripts/check_junit_results.py case-w08b-migration
      - name: Apply W09 official PDF issuance migration
        run: bash ./gradlew test --tests '*CaseW09MigrationMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W09 migration test ran
        run: python3 .github/scripts/check_junit_results.py case-w09-migration
      - name: Validate JPA schema
        run: bash ./gradlew test --tests '*FanReportSchemaValidateMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm schema tests ran
        run: python3 .github/scripts/check_junit_results.py mysql-schema
      - name: Validate W05 JPA mappings
        run: bash ./gradlew test --tests '*CaseW05SchemaValidateMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W05 schema test ran
        run: python3 .github/scripts/check_junit_results.py case-w05-schema
      - name: Validate W07 preservation JPA mappings
        run: bash ./gradlew test --tests '*CaseW07SchemaValidateMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W07 schema test ran
        run: python3 .github/scripts/check_junit_results.py case-w07-schema
      - name: Validate W08a approval request JPA mappings
        run: bash ./gradlew test --tests '*CaseW08aSchemaValidateMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W08a schema test ran
        run: python3 .github/scripts/check_junit_results.py case-w08a-schema
      - name: Validate W08b review receipt and decision JPA mappings
        run: bash ./gradlew test --tests '*CaseW08bSchemaValidateMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W08b schema test ran
        run: python3 .github/scripts/check_junit_results.py case-w08b-schema
      - name: Validate W09 official PDF JPA mappings
        run: bash ./gradlew test --tests '*CaseW09SchemaValidateMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W09 schema test ran
        run: python3 .github/scripts/check_junit_results.py case-w09-schema
      - name: Verify private MinIO object storage
        run: bash ./gradlew test --tests '*S3EvidenceObjectStorageMinioTest' --rerun-tasks --no-daemon
      - name: Confirm all object storage tests ran
        run: python3 .github/scripts/check_junit_results.py minio-storage
      - name: Verify versioned private official PDF storage
        run: bash ./gradlew test --tests '*S3OfficialPdfStorageMinioTest' --rerun-tasks --no-daemon
      - name: Confirm official PDF storage tests ran
        run: python3 .github/scripts/check_junit_results.py case-w09-minio-storage
      - name: Verify MinIO and MySQL recovery
        run: bash ./gradlew test --tests '*FanReportMinioMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm all recovery tests ran
        run: python3 .github/scripts/check_junit_results.py minio-mysql
      - name: Verify W05 private evidence capture on MinIO and MySQL
        run: bash ./gradlew test --tests '*CaseW05MinioMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W05 private evidence tests ran
        run: python3 .github/scripts/check_junit_results.py case-w05-minio
      - name: Verify W06 original bytes and replacement on MinIO and MySQL
        run: bash ./gradlew test --tests '*CaseW06MinioMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W06 MinIO and MySQL test ran
        run: python3 .github/scripts/check_junit_results.py case-w06-minio-mysql
      - name: Verify W06 historical version access in isolated MinIO bucket
        run: bash ./gradlew test --tests '*S3EvidenceIntegrityVersionedMinioTest' --rerun-tasks --no-daemon
      - name: Confirm W06 versioned MinIO test ran
        run: python3 .github/scripts/check_junit_results.py case-w06-versioned-minio
      - name: Verify W07 Object Lock and version deletion controls
        run: bash ./gradlew test --tests '*S3EvidencePreservationObjectLockMinioTest' --rerun-tasks --no-daemon
      - name: Confirm W07 Object Lock tests ran
        run: python3 .github/scripts/check_junit_results.py case-w07-object-lock-minio
      - name: Verify W07 locked object proof on MinIO and MySQL
        run: bash ./gradlew test --tests '*CaseW07MinioMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W07 MinIO and MySQL test ran
        run: python3 .github/scripts/check_junit_results.py case-w07-minio-mysql
      - name: Confirm W08a uses the real locked object proof
        run: python3 .github/scripts/check_junit_results.py case-w08a-minio-mysql
      - name: Confirm W08b uses the same real locked object proof before decision
        run: python3 .github/scripts/check_junit_results.py case-w08b-minio-mysql
      - name: Verify W09 official PDF issuance and download on MinIO and MySQL
        run: bash ./gradlew test --tests '*CaseW09MinioMySqlTest' --rerun-tasks --no-daemon
      - name: Confirm W09 MinIO and MySQL test ran
        run: python3 .github/scripts/check_junit_results.py case-w09-minio-mysql
      - name: Remove only this job's MinIO container
        if: always()
        run: docker rm -f td-issue32-ci-minio 2>/dev/null || true
