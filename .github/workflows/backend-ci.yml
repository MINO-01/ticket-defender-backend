name: Backend CI

on:
  pull_request:
  push:
    branches: [main, 'feat/#38-evidence-integrity-gate', 'feat/#40-evidence-preservation-gate', 'feat/#42-approval-request-binding', 'feat/#44-approval-review-decision', 'feat/#46-official-pdf-issuance']
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run the complete MySQL and MinIO regression suites
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# New commits cancel obsolete PR runs only. main, scheduled, and manual full
# regressions are never cancelled by a later push.
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  change-plan:
    runs-on: ubuntu-latest
    outputs:
      mysql_suite: ${{ steps.plan.outputs.mysql_suite }}
      run_mysql: ${{ steps.plan.outputs.run_mysql }}
      run_minio: ${{ steps.plan.outputs.run_minio }}
      run_legacy: ${{ steps.plan.outputs.run_legacy }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: Classify changed files conservatively
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_REGRESSION: ${{ inputs.full_regression }}
        run: |
          set -euo pipefail
          : > .ci-changed-files
          force_full=false
          if [[ "$EVENT_NAME" != "pull_request" || "$FULL_REGRESSION" == "true" ]]; then
            force_full=true
          elif [[ -n "$BASE_SHA" ]]; then
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > .ci-changed-files
          else
            force_full=true
          fi
          if [[ "$force_full" == true ]]; then
            python3 .github/scripts/ci_test_plan.py --files .ci-changed-files --force-full --github-output "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/ci_test_plan.py --files .ci-changed-files --github-output "$GITHUB_OUTPUT"
          fi
          python3 .github/scripts/test_ci_test_plan.py

  java21-build:
    needs: change-plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with: { cache-provider: basic }
      - name: Build and run default regression tests
        run: bash ./gradlew build --build-cache
      - name: Check skipped tests and reasons
        run: python3 .github/scripts/check_junit_results.py core

  mysql8-integration:
    needs: change-plan
    if: needs.change-plan.outputs.run_mysql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env: { MYSQL_DATABASE: td_issue32_ci, MYSQL_ROOT_PASSWORD: synthetic_ci_only_password }
        ports: ['13307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TD_ISSUE32_MYSQL_URL: jdbc:mysql://127.0.0.1:13307/td_issue32_ci?useSSL=false&allowPublicKeyRetrieval=true
      TD_ISSUE32_MYSQL_USER: root
      TD_ISSUE32_MYSQL_PASSWORD: synthetic_ci_only_password
      TD_MYSQL_MIGRATION_URL: jdbc:mysql://127.0.0.1:13307/td_issue32_ci?useSSL=false&allowPublicKeyRetrieval=true
      TD_MYSQL_MIGRATION_USER: root
      TD_MYSQL_MIGRATION_PASSWORD: synthetic_ci_only_password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with: { cache-provider: basic }
      - name: Run ordered MySQL suite selected by the safety plan
        run: |
          # Contract manifest: the actual ordered invocations are in run_ci_suite.sh.
          # AdminEventReadMySqlTest / check_junit_results.py admin-event-read
          # AdminFanReportReadMySqlTest / check_junit_results.py admin-fan-report-read
          # AdminEvidenceContentMigrationMySqlTest / check_junit_results.py admin-evidence-content-migration
          # CaseW05MigrationMySqlTest / check_junit_results.py case-w05-migration
          # CaseW05ConcurrentMySqlTest / check_junit_results.py case-w05-concurrency
          # CaseW06MigrationMySqlTest / check_junit_results.py case-w06-migration
          # CaseW06SchemaValidateMySqlTest / check_junit_results.py case-w06-schema
          # CaseW06ConcurrentMySqlTest / check_junit_results.py case-w06-concurrency
          # CaseW08aMigrationMySqlTest / check_junit_results.py case-w08a-migration
          # CaseW08aSchemaValidateMySqlTest / check_junit_results.py case-w08a-schema
          # CaseW08aConcurrentMySqlTest / check_junit_results.py case-w08a-concurrency
          # CaseW08bMigrationMySqlTest / check_junit_results.py case-w08b-migration
          # CaseW08bSchemaValidateMySqlTest / check_junit_results.py case-w08b-schema
          # CaseW08bConcurrentMySqlTest / check_junit_results.py case-w08b-concurrency
          # CaseW09MigrationMySqlTest / check_junit_results.py case-w09-migration
          # CaseW09SchemaValidateMySqlTest / check_junit_results.py case-w09-schema
          # CaseW09ConcurrentMySqlTest / check_junit_results.py case-w09-concurrency
          # Track2ListingAnalysisMigrationMySqlTest / check_junit_results.py track2-listing-migration
          # Track2ListingAnalysisSchemaValidateMySqlTest / check_junit_results.py track2-listing-schema
          # Track2ListingAnalysisConcurrentMySqlTest / check_junit_results.py track2-listing-concurrency
          # Track2CandidatePipelineMigrationMySqlTest / Track2CandidatePipelineSchemaValidateMySqlTest
          # Track2CandidatePipelineHttpMySqlTest / Track2CandidatePipelineConcurrentMySqlTest / check_junit_results.py track2-candidate-concurrency
          bash .github/scripts/run_ci_suite.sh '${{ needs.change-plan.outputs.mysql_suite }}'

  mysql8-track1-legacy:
    needs: change-plan
    if: needs.change-plan.outputs.run_legacy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env: { MYSQL_DATABASE: td_track1_ci, MYSQL_ROOT_PASSWORD: synthetic_ci_only_password }
        ports: ['13307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TD_MYSQL_MIGRATION_URL: jdbc:mysql://127.0.0.1:13307/td_track1_ci?useSSL=false&allowPublicKeyRetrieval=true
      TD_MYSQL_MIGRATION_USER: root
      TD_MYSQL_MIGRATION_PASSWORD: synthetic_ci_only_password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with: { cache-provider: basic }
      - name: Verify Track 1 legacy migration
        run: bash .github/scripts/run_ci_suite.sh legacy

  minio-integration:
    needs: change-plan
    if: needs.change-plan.outputs.run_minio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env: { MYSQL_DATABASE: td_issue32_minio_ci, MYSQL_ROOT_PASSWORD: synthetic_ci_only_password }
        ports: ['13307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TD_ISSUE32_MYSQL_URL: jdbc:mysql://127.0.0.1:13307/td_issue32_minio_ci?useSSL=false&allowPublicKeyRetrieval=true
      TD_ISSUE32_MYSQL_USER: root
      TD_ISSUE32_MYSQL_PASSWORD: synthetic_ci_only_password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with: { cache-provider: basic }
      - name: Build pinned disposable MinIO test image
        run: docker build --file .github/docker/minio-ci.Dockerfile --tag td-issue32-minio-ci:local .
      - name: Start private MinIO test bucket
        run: bash .github/scripts/start_minio_ci.sh
      - name: Run ordered MinIO preservation suite
        run: |
          # Contract manifest: the actual ordered invocations are in run_ci_suite.sh.
          # AdminEvidenceContentMigrationMySqlTest / check_junit_results.py admin-evidence-content-migration
          # AdminEvidenceContentMinioMySqlTest / check_junit_results.py admin-evidence-content-minio-mysql
          # CaseW05MinioMySqlTest / check_junit_results.py case-w05-minio
          # CaseW06MinioMySqlTest / check_junit_results.py case-w06-minio-mysql
          # S3EvidenceIntegrityVersionedMinioTest / check_junit_results.py case-w06-versioned-minio
          # CaseW07MinioMySqlTest / check_junit_results.py case-w08a-minio-mysql
          # CaseW07MinioMySqlTest / check_junit_results.py case-w08b-minio-mysql
          # CaseW08aMigrationMySqlTest / check_junit_results.py case-w08a-migration
          # CaseW08bMigrationMySqlTest / check_junit_results.py case-w08b-migration
          # CaseW09MigrationMySqlTest / check_junit_results.py case-w09-migration
          # CaseW09MinioMySqlTest / check_junit_results.py case-w09-minio-mysql
          # S3OfficialPdfStorageMinioTest / check_junit_results.py case-w09-minio-storage
          # Track2ListingAnalysisMigrationMySqlTest / check_junit_results.py track2-listing-migration
          # Track2ListingAnalysisMinioMySqlTest / check_junit_results.py track2-listing-minio-mysql
          bash .github/scripts/run_ci_suite.sh minio-full
      - name: Remove only this job's MinIO container
        if: always()
        run: docker rm -f td-issue32-ci-minio 2>/dev/null || true

  ci-required:
    needs: [change-plan, java21-build, mysql8-integration, mysql8-track1-legacy, minio-integration]
    if: always()
    runs-on: ubuntu-latest
    name: ci-required
    steps:
      - name: Fail when a required suite was skipped or failed
        env:
          JAVA_RESULT: ${{ needs.java21-build.result }}
          MYSQL_RESULT: ${{ needs.mysql8-integration.result }}
          LEGACY_RESULT: ${{ needs.mysql8-track1-legacy.result }}
          MINIO_RESULT: ${{ needs.minio-integration.result }}
          RUN_MYSQL: ${{ needs.change-plan.outputs.run_mysql }}
          RUN_LEGACY: ${{ needs.change-plan.outputs.run_legacy }}
          RUN_MINIO: ${{ needs.change-plan.outputs.run_minio }}
          PLAN_REASON: ${{ needs.change-plan.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$JAVA_RESULT" == success ]] || { echo "java21-build=$JAVA_RESULT"; exit 1; }
          require_result() {
            local expected="$1" result="$2" name="$3"
            if [[ "$expected" == true && "$result" != success ]]; then echo "required $name=$result"; exit 1; fi
            if [[ "$expected" == false && "$result" != skipped ]]; then echo "unplanned $name=$result"; exit 1; fi
          }
          require_result "$RUN_MYSQL" "$MYSQL_RESULT" mysql8-integration
          require_result "$RUN_LEGACY" "$LEGACY_RESULT" mysql8-track1-legacy
          require_result "$RUN_MINIO" "$MINIO_RESULT" minio-integration
          echo "CI plan accepted: $PLAN_REASON"
