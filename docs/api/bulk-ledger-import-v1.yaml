openapi: 3.1.0
info:
  title: Ticket Defender bulk ledger import API
  version: 1.5.0
  description: >-
    BL-03 keeps v1 staging-only. v2 accepts explicit ticket facts and source ordering, then prepares private candidate
    ledger versions. A ready v2 candidate can be atomically published by a TENANT_ADMIN; publication only writes
    a private MySQL outbox record and never starts analysis or makes a fraud decision.
    v3는 v2 필수 열에 원본 신호 선택 열을 더한 합성 격리 전용 형식입니다. 백엔드가 행을 읽는 즉시 정규화하고 신호별
    목적의 HMAC으로 바꾸며, 원본 값은 DB, 로그, 오류 응답에 남기지 않습니다. v3는 기본 비활성화이고, 켜려면 업로드
    원본 정리 작업이 함께 켜져 있어야 하며 시작 시 저장소 버전 삭제가 확인돼야 합니다. 열, 정규화, 오류 코드, 삭제,
    migration 순서는 docs/operations/bulk-ledger-v3-raw-intake.md를 따릅니다. v1과 v2의 동작은 바뀌지 않습니다.
security: [{ adminBearer: [] }]
paths:
  /api/v1/admin/ledger-imports:
    post:
      summary: Register a bulk import job
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } }
      responses:
        '201': { description: CREATED job, headers: { Cache-Control: { schema: { example: no-store } } } }
        '400': { description: INVALID_IDEMPOTENCY_KEY or malformed JSON }
        '401': { description: UNAUTHENTICATED }
        '403': { description: caller lacks TENANT_ADMIN }
        '404': { description: unknown or out-of-scope event/performance }
        '409': { description: idempotency/sourceBatch/state/concurrency conflict }
        '422': { description: metadata or scope-manifest validation failure, or BULK_V3_RAW_INTAKE_DISABLED for v3 }
        '503': { description: BULK_V3_DELETE_PERMISSION_UNVERIFIED for v3 when startup delete verification failed }
    get:
      summary: List visible import jobs
      responses: { '200': { description: no-store paged jobs }, '401': { description: UNAUTHENTICATED } }
  /api/v1/admin/ledger-imports/upload-deletions/status:
    get:
      summary: 업로드 원본 삭제 결과 요약
      description: >-
        같은 tenant의 업로드 원본 삭제 성공 건수와 3회 시도 후에도 지우지 못한 건수를 돌려줍니다. 객체 키, 버전 ID,
        원본 값은 담지 않습니다. 조회 역할(TENANT_ADMIN, ANALYST, REVIEWER, APPROVER)이 필요합니다.
      responses:
        '200': { description: no-store summary, content: { application/json: { schema: { $ref: '#/components/schemas/UploadDeletionStatus' } } } }
        '401': { description: UNAUTHENTICATED }
        '403': { description: caller lacks a view role }
  /api/v1/admin/ledger-imports/{importId}:
    parameters: [{ $ref: '#/components/parameters/ImportId' }]
    get:
      summary: Get one job
      responses: { '200': { description: job metadata }, '404': { description: RESOURCE_NOT_FOUND for a foreign job } }
  /api/v1/admin/ledger-imports/{importId}/errors:
    parameters: [{ $ref: '#/components/parameters/ImportId' }]
    get:
      summary: List code-only validation errors
      description: >-
        행 번호와 코드만 담습니다. v3 행 오류 코드는 BULK_CSV_IP_INVALID, BULK_CSV_IP_NETWORK_TYPE_INVALID,
        BULK_CSV_PAYMENT_UNMASKED, BULK_CSV_PAYMENT_INCOMPLETE, BULK_CSV_REFUND_ACCOUNT_INCOMPLETE, BULK_CSV_PHONE_INVALID,
        BULK_CSV_ADDRESS_INVALID이며, v3가 닫힌 상태의 작업은 BULK_V3_RAW_INTAKE_DISABLED입니다.
      responses: { '200': { description: code-only rows written by the staging worker }, '404': { description: RESOURCE_NOT_FOUND } }
  /api/v1/admin/ledger-imports/{importId}/cancel:
    parameters: [{ $ref: '#/components/parameters/ImportId' }]
    post:
      summary: Cancel a non-terminal job
      responses: { '200': { description: CANCELLED job }, '403': { description: caller lacks TENANT_ADMIN }, '404': { description: RESOURCE_NOT_FOUND }, '409': { description: BULK_IMPORT_STATE_TRANSITION_INVALID } }
  /api/v1/admin/ledger-imports/{importId}/upload-session:
    parameters: [{ $ref: '#/components/parameters/ImportId' }]
    post:
      summary: Create one short-lived server-keyed private CSV upload session
      description: The response is no-store and the URL is never returned by job, error, or audit reads.
      responses:
        '201': { description: one-time upload URL and expiry, headers: { Cache-Control: { schema: { example: no-store } } }, content: { application/json: { schema: { $ref: '#/components/schemas/UploadSession' } } } }
        '404': { description: RESOURCE_NOT_FOUND for a foreign job }
        '409': { description: disabled synthetic scope, invalid state, or UPLOAD_OBJECT_EXPIRED after retention cleanup }
        '422': { description: declared file exceeds the configured private-upload limit }
        '503': { description: private object storage unavailable or disabled }
  /api/v1/admin/ledger-imports/{importId}/complete-upload:
    parameters: [{ $ref: '#/components/parameters/ImportId' }]
    post:
      summary: Verify actual object version, bytes, and SHA-256 then start private staging
      description: S3 ETag is never a digest. A verified object version is re-read by the worker; no client bucket or key is accepted.
      responses:
        '200': { description: UPLOADED, VALIDATING, STAGING, READY_TO_PUBLISH, REJECTED, or FAILED_RETRYABLE job; response is no-store }
        '404': { description: RESOURCE_NOT_FOUND for a foreign job }
        '409': { description: duplicate completion, expired session, cancellation, unavailable synthetic scope, or UPLOAD_OBJECT_EXPIRED after retention cleanup }
        '422': { description: version, size, or SHA-256 mismatch }
        '503': { description: private object storage unavailable }
  /api/v1/admin/ledger-imports/{importId}/publish:
    parameters: [{ $ref: '#/components/parameters/ImportId' }]
    post:
      summary: Atomically publish every READY v2 or v3 candidate scope for one import
      description: >-
        The server derives all performance scopes from the import. It locks those server-owned performance rows in
        deterministic order, rechecks expected heads and source checkpoints, then writes heads, PUBLISHED state,
        immutable history and PENDING outbox rows in one transaction. It never downloads CSV or calls analysis.
        v3에서는 같은 트랜잭션에서 스테이징 신호 HMAC을 공개 버전 ID로 td_bulk_ledger_track1_ticket_signals에 기록합니다.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: published or recovered idempotent result, headers: { Cache-Control: { schema: { example: no-store } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Publication' } } } }
        '403': { description: caller lacks TENANT_ADMIN }
        '404': { description: RESOURCE_NOT_FOUND for foreign or out-of-scope import }
        '409': { description: candidate/head/source/idempotency/concurrency conflict }
  /api/v1/admin/ledger-imports/{importId}/publication:
    parameters: [{ $ref: '#/components/parameters/ImportId' }]
    get:
      summary: Get the committed publication result and per-performance history link
      responses:
        '200': { description: no-store publication result, content: { application/json: { schema: { $ref: '#/components/schemas/Publication' } } } }
        '404': { description: RESOURCE_NOT_FOUND or no committed publication }
  /api/v1/admin/ledger-imports/{importId}/candidates:
    parameters: [{ $ref: '#/components/parameters/ImportId' }]
    get:
      summary: Preview every server-owned candidate ledger scope before publication
      description: >-
        This is a no-store, read-only point-in-time preview. It neither creates nor repairs candidates and does not
        guarantee that a later publication will succeed; publication rechecks current heads and source checkpoints.
        A caller needs TENANT_ADMIN and access to every import scope. A foreign or partially inaccessible import is
        reported as RESOURCE_NOT_FOUND without returning any partial scope data.
      responses:
        '200': { description: candidate preparation, completeness and current head relation, content: { application/json: { schema: { $ref: '#/components/schemas/CandidatePreview' } } } }
        '401': { description: UNAUTHENTICATED }
        '403': { description: caller lacks TENANT_ADMIN }
        '404': { description: RESOURCE_NOT_FOUND for foreign or partially out-of-scope import }
components:
  securitySchemes: { adminBearer: { type: http, scheme: bearer, bearerFormat: JWT } }
  parameters: { ImportId: { name: importId, in: path, required: true, schema: { type: string, format: uuid } } }
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, sourceSystem, sourceBatchId, mode, format, declaredObjectSha256, declaredFileBytes, declaredRowCount, completeSnapshot]
      properties:
        schemaVersion: { type: string, enum: [v1, v2, v3], description: 'v1 remains staging-only. Candidate preparation requires v2 or v3. v3는 v2 범위 규칙을 그대로 쓰고 원본 신호 선택 열을 허용합니다.' }
        sourceSystem: { type: string, maxLength: 64 }
        sourceBatchId: { type: string, maxLength: 128 }
        mode: { type: string, enum: [FULL_SNAPSHOT, CHANGE_FEED] }
        format: { type: string, enum: [CSV] }
        declaredObjectSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        declaredFileBytes: { type: integer, minimum: 0 }
        declaredRowCount: { type: integer, minimum: 0 }
        completeSnapshot: { type: boolean, description: 'true only for FULL_SNAPSHOT' }
        scopeKeyType: { type: string, enum: [TD_UUID, SUPPLIER_CODE], default: TD_UUID, description: 'TD_UUID keeps the existing eventId/performanceId registration. SUPPLIER_CODE is v3-only and resolves codes after complete CSV validation.' }
        scopes: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Scope' }, description: 'Required only for TD_UUID.' }
        supplierScopes: { type: array, minItems: 1, items: { $ref: '#/components/schemas/SupplierScope' }, description: 'Required only for scopeKeyType SUPPLIER_CODE; no UUIDs are supplied by the client.' }
    SupplierScope:
      type: object
      required: [sourceEventCode, sourcePerformanceCode, eventTitle, performanceStartsAt, declaredRowCount]
      properties:
        sourceEventCode: { type: string, minLength: 1, maxLength: 128 }
        sourcePerformanceCode: { type: string, minLength: 1, maxLength: 128 }
        eventTitle: { type: string, minLength: 1, maxLength: 255 }
        performanceStartsAt: { type: string, format: date-time, description: 'ISO 8601 timestamp with an explicit UTC offset.' }
        perAccountLimit: { type: [integer, 'null'], minimum: 1, description: 'Supplier-declared per-account performance limit. Omitted values do not erase an existing declared value.' }
        scopeAsOf: { type: string, format: date-time, description: 'Required only for FULL_SNAPSHOT.' }
        declaredRowCount: { type: integer, minimum: 0 }
        cursorStart: { type: string, maxLength: 256 }
        cursorEnd: { type: string, maxLength: 256 }
        sourceSequenceStart: { type: integer, minimum: 0 }
        sourceSequenceEnd: { type: integer, minimum: 0 }
        eventId: { type: [string, 'null'], format: uuid, readOnly: true }
        performanceId: { type: [string, 'null'], format: uuid, readOnly: true }
        eventCreated: { type: boolean, readOnly: true }
        performanceCreated: { type: boolean, readOnly: true }
    Scope:
      type: object
      required: [eventId, performanceId, declaredRowCount]
      properties:
        eventId: { type: string, format: uuid }
        performanceId: { type: string, format: uuid }
        declaredRowCount: { type: integer, minimum: 0 }
        scopeAsOf: { type: string, format: date-time, description: 'required only for FULL_SNAPSHOT' }
        cursorStart: { type: string, maxLength: 256, description: 'required only for CHANGE_FEED' }
        cursorEnd: { type: string, maxLength: 256, description: 'v1 CHANGE_FEED and v2 source checkpoint end; v2 FULL_SNAPSHOT requires it.' }
        sourceSequenceStart: { type: integer, minimum: 0, description: 'v2 CHANGE_FEED: first contiguous source sequence.' }
        sourceSequenceEnd: { type: integer, minimum: 0, description: 'v2: snapshot checkpoint or CHANGE_FEED last contiguous source sequence.' }
    Job:
      type: object
      description: 'No raw row, reservation, account, payment, IP, object key, lease owner, or key digest is returned.'
      properties:
        importId: { type: string, format: uuid }
        status: { type: string, enum: [CREATED, UPLOAD_PENDING, UPLOADED, VALIDATING, STAGING, READY_TO_PUBLISH, PUBLISHED, FAILED_RETRYABLE, REJECTED, CANCELLED] }
        mode: { type: string, enum: [FULL_SNAPSHOT, CHANGE_FEED] }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
        scopeKeyType: { type: string, enum: [TD_UUID, SUPPLIER_CODE] }
        supplierScopes: { type: array, items: { $ref: '#/components/schemas/SupplierScope' }, description: 'Resolved code to UUID mapping and creation flags; never includes CSV row values.' }
        processedRowCount: { type: integer, minimum: 0 }
        acceptedRowCount: { type: integer, minimum: 0 }
        rejectedRowCount: { type: integer, minimum: 0 }
    UploadDeletionStatus:
      type: object
      required: [v3RawIntakeAccepted, deletedCount, failedAfterRetriesCount, maxAttempts]
      properties:
        v3RawIntakeAccepted: { type: boolean, description: 'v3 설정이 켜져 있고 시작 시 저장소 버전 삭제가 확인됐는지' }
        deletedCount: { type: integer, minimum: 0 }
        failedAfterRetriesCount: { type: integer, minimum: 0, description: '3회 시도 후에도 지우지 못한 업로드 수' }
        maxAttempts: { type: integer, enum: [3] }
    UploadSession:
      type: object
      required: [uploadUrl, expiresAt]
      properties:
        uploadUrl: { type: string, format: uri, description: 'Short-lived private upload capability; do not log or persist client-side.' }
        expiresAt: { type: string, format: date-time }
    Publication:
      type: object
      required: [publicationId, importId, sourceSystem, sourceBatchId, publishedAt, scopes]
      properties:
        publicationId: { type: string, format: uuid }
        importId: { type: string, format: uuid }
        sourceSystem: { type: string }
        sourceBatchId: { type: string }
        publishedAt: { type: string, format: date-time }
        scopes:
          type: array
          items:
            type: object
            properties:
              eventId: { type: string, format: uuid }
              performanceId: { type: string, format: uuid }
              previousVersionId: { type: [string, 'null'], format: uuid }
              versionId: { type: string, format: uuid }
              generation: { type: integer, minimum: 0 }
              revision: { type: integer, minimum: 0 }
              outboxPending: { type: boolean, description: 'Stored reservation only; it does not indicate analysis execution.' }
    CandidatePreview:
      type: object
      required: [importId, preparationStatus, dataStatus, failureCode, scopes]
      properties:
        importId: { type: string, format: uuid }
        preparationStatus: { type: string, enum: [NOT_STARTED, PREPARING, READY, REJECTED, PUBLISHED] }
        dataStatus: { type: string, enum: [NOT_AVAILABLE, PREPARING, COMPLETE, INCOMPLETE] }
        failureCode: { type: [string, 'null'], description: 'Present only when preparation is REJECTED.' }
        scopes:
          type: array
          description: 'Exactly the declared import scopes, ordered by eventId then performanceId.'
          items: { $ref: '#/components/schemas/CandidateScope' }
    CandidateScope:
      type: object
      required: [eventId, performanceId, versionId, generation, revision, baseVersionId, expectedHeadKnown, expectedHeadVersionId, currentHeadVersionId, headStatus, versionStatus]
      properties:
        eventId: { type: string, format: uuid }
        performanceId: { type: string, format: uuid }
        versionId: { type: [string, 'null'], format: uuid, description: 'Null when preparation has not created this scope version.' }
        generation: { type: [integer, 'null'], minimum: 0 }
        revision: { type: [integer, 'null'], minimum: 0 }
        baseVersionId: { type: [string, 'null'], format: uuid }
        expectedHeadKnown: { type: [boolean, 'null'], description: 'Null when the candidate scope version is unavailable.' }
        expectedHeadVersionId: { type: [string, 'null'], format: uuid }
        currentHeadVersionId: { type: [string, 'null'], format: uuid }
        headStatus: { type: string, enum: [UNAVAILABLE, UNKNOWN, CURRENT, CHANGED] }
        versionStatus: { type: [string, 'null'], enum: [PREPARING, READY, REJECTED, PUBLISHED] }
