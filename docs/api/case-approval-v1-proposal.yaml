      summary: 승인된 보고서의 공식 발급 예약 또는 실패한 동일 입력 재시도
      description: >-
        발급 권한은 별도 확정 대상이며 현재 API/기존 AuditReportService 차단은 미구현·유지 상태다.
        APPROVED 또는 GENERATION_FAILED만 허용한다. Case.status=APPROVED_FOR_REPORT,
        ACTIVE IssuanceHold·종료·진행 중 예약 없음, 현재 근거/currentReportVersionId·
        Decision·snapshot·내용 digest를 짧은 DB 트랜잭션에서 확인해 단일 발급을 예약한다.
        GENERATION_FAILED 재시도도 동일 봉인 입력/템플릿만 사용한다. 외부 렌더링은
        트랜잭션 밖에서 봉인 입력만으로 수행하고 비공개 임시 저장한다. 공개 직전 같은
        Case/ReportVersion 직렬화 경계에서 보류·증거 revision·상태·내용 digest를 재확인한다.
        보류/V2/종료가 먼저면 임시 결과를 공개하지 않고 예약을 해제해 RENDERING에서
        APPROVED로 복귀하며 차단 감사를 남긴다. 비공개 불변 후보 object의 checksum을
        확인한 뒤 짧은 최종화 DB 트랜잭션에서 후보 참조·새 GENERATED·이전
        SUPERSEDED·감사를 함께 확정한다. 다운로드는 확정 참조만 제공하며 DB 실패
        후보는 공개하지 않는다. GENERATED 재렌더/덮어쓰기는 금지한다.
      parameters:
        - {$ref: '#/components/parameters/ReportVersionId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenderReportInput'}
      responses:
        '202':
          description: 발급 예약 성공. PDF가 생성되었다는 뜻은 아님. 동일 키/본문은 저장된 응답.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportVersion'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
  /api/v1/report-versions/{reportVersionId}/download:
    get:
      tags: [Reports]
      operationId: downloadGeneratedReportProposal
      x-required-roles: [TENANT_ADMIN, ANALYST, REVIEWER, APPROVER, AUDITOR]
      summary: 이미 생성된 불변 PDF 파일 다운로드
      description: >-
        인증·tenant/event·보고서 열람 권한 검사와 접근 감사를 남긴 뒤 GENERATED 또는
        SUPERSEDED의 기존 저장 파일을 그대로 stream한다. Case가 CLOSED이거나 현재
        근거가 V2여도 이미 생성된 파일은 재다운로드할 수 있지만 새로 렌더하거나 신규
        발급하지 않는다. 과거 버전임을 응답 메타데이터에 표시한다.
      parameters: [{$ref: '#/components/parameters/ReportVersionId'}]
      responses:
        '200':
          description: 기존 저장 PDF bytes. 같은 reportVersionId에서 bytes 변경 금지.
          headers:
            X-Report-Historical:
              description: 현재 승인 적격성이 STALE이거나 SUPERSEDED이면 true
              schema: {type: boolean}
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
components:
  securitySchemes:
    userAuth:
      type: http
      scheme: bearer
      description: 제안된 인증 방식 표시. 실제 OIDC/세션 방식은 미확정이며 현재 미구현.
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema: {type: string, format: uuid}
    EvidenceSnapshotId:
      name: evidenceSnapshotId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ApprovalRequestId:
      name: approvalRequestId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ReportVersionId:
      name: reportVersionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 같은 actor·tenant·operation 범위의 고엔트로피 키. 인증 수단은 아님.
      schema: {type: string, minLength: 8, maxLength: 128}
  responses:
    BadRequest: {description: '400 INVALID_REQUEST: JSON/파라미터 형식 오류', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Unauthenticated: {description: '401 UNAUTHENTICATED: 인증 실패', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Forbidden: {description: '403 FORBIDDEN 또는 SELF_APPROVAL_FORBIDDEN: 같은 tenant 내 기능/역할 권한 부족', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    NotFound: {description: '404 RESOURCE_NOT_FOUND: 없음·타 tenant·숨겨야 할 공연 범위. 존재 여부를 구별해 노출하지 않음', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Conflict: {description: '409 상태/버전/멱등성/승인 중복/증거 불일치. 최신 자원을 다시 조회', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    ValidationFailed: {description: '422 VALIDATION_FAILED: 형식은 맞으나 필드·업무 제약 위반', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    InternalError: {description: '500 INTERNAL_ERROR: 서버 장애. 정상 0건 또는 반려로 변환하지 않음', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    DependencyUnavailable: {description: '503 DEPENDENCY_UNAVAILABLE: 필수 저장/검증 의존성 장애', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  schemas:
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    CaseStatus:
      type: string
      description: PROPOSED. ApprovalRequest status와 별개.
      enum: [OPEN, TRIAGED, IN_REVIEW, NEEDS_EVIDENCE, READY_FOR_APPROVAL, APPROVED_FOR_REPORT, DISMISSED, CLOSED]
    CaseType:
      type: string
      description: Specs 관리자 API 초안과 같은 Case 출처 분류. 후속 Case도 독립적으로 분류한다.
      enum: [GRAPH_CLUSTER, FAN_REPORT, COMBINED]
    CreateCaseInput:
      type: object
      additionalProperties: false
      required: [eventId, type, reason]
      allOf:
        - if: {properties: {type: {const: GRAPH_CLUSTER}}}
          then: {required: [findingIds], not: {required: [fanReportIds]}}
        - if: {properties: {type: {const: FAN_REPORT}}}
          then: {required: [fanReportIds], not: {required: [findingIds]}}
        - if: {properties: {type: {const: COMBINED}}}
          then: {required: [findingIds, fanReportIds]}
      dependentRequired:
        relatedCaseId: [relationReason]
        relationReason: [relatedCaseId]
        evidenceIds: [fanReportIds]
      properties:
        eventId: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/CaseType'}
        findingIds: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uuid}}
        fanReportIds: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uuid}}
        evidenceIds: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uuid}}
        reason: {type: string, minLength: 3, maxLength: 2000}
        relatedCaseId: {type: string, format: uuid}
        relationReason: {type: string, minLength: 3, maxLength: 2000}
      description: >-
        GRAPH_CLUSTER는 findingIds만, FAN_REPORT는 영속 fanReportIds만,
        COMBINED는 둘 다
        필요하다. evidenceIds는 명시된 fanReportIds에 속한 파일 항목이며 단독으로 제보
        출처를 만들 수 없다. 서버가 모든 제보·파일의 존재·tenant/event·소유 관계를 검증한다.
        relatedCaseId와 relationReason은 함께 제공하고 원 Case가 같은 tenant/event의
        DISMISSED 또는 CLOSED인지 검사한다. 원 Case의 승인·보고서·감사는 승계하지 않는다.
    Case:
      type: object
      additionalProperties: false
      required: [caseId, eventId, type, status, caseVersion, evidenceRevision, hasActiveIssuanceHold, allowedActions, createdAt]
      allOf:
        - if: {properties: {status: {const: CLOSED}}, required: [status]}
          then: {required: [closureDisposition, closureReason, closedAt]}
        - if: {properties: {closureDisposition: {const: NO_NEW_REPORT_AFTER_STALE}}, required: [closureDisposition]}
          then:
            required: [closureEvidenceRevision, closureReviewActivityId, closureStaleApprovalDecisionId, closurePriorGeneratedReportVersionIds, closureActivityId, noNewReportReason]
            properties: {status: {const: CLOSED}}
      properties:
        caseId: {type: string, format: uuid}
        eventId: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/CaseType'}
        status: {$ref: '#/components/schemas/CaseStatus'}
        caseVersion: {type: integer, minimum: 0}
        evidenceRevision: {type: integer, minimum: 0}
        hasActiveIssuanceHold: {type: boolean, readOnly: true, description: 서버 ACTIVE 보류의 조회 투영. 발급 게이트는 저장 상태를 재검사.}
        assigneeUserId: {type: [string, 'null'], format: uuid}
        currentReportVersionId: {type: string, format: uuid, readOnly: true}
        relatedCaseId: {type: string, format: uuid}
        relationReason: {type: string, maxLength: 2000}
        summary: {type: string, maxLength: 2000}
        closureDisposition: {type: string, enum: [GENERATED_REPORT, ISSUANCE_ABANDONED, NO_NEW_REPORT_AFTER_STALE, NOT_APPLICABLE], readOnly: true}
        closureReason: {type: string, minLength: 3, maxLength: 2000, readOnly: true}
        closureReportVersionId: {type: string, format: uuid, readOnly: true}
        issuanceAbandonmentReason: {type: string, readOnly: true}
        noNewReportReason: {type: string, minLength: 3, maxLength: 2000, readOnly: true}
        closureEvidenceRevision: {type: integer, minimum: 1, readOnly: true}
        closureReviewActivityId: {type: string, format: uuid, readOnly: true, description: 종료 전에 확정된 EVIDENCE_REVIEW_COMPLETED CaseActivity.activityId.}
        closureStaleApprovalDecisionId: {type: string, format: uuid, readOnly: true}
        closurePriorGeneratedReportVersionIds: {type: array, uniqueItems: true, items: {type: string, format: uuid}, readOnly: true}
        closureActivityId: {type: string, format: uuid, readOnly: true}
        closedAt: {type: string, format: date-time, readOnly: true}
        allowedActions: {type: array, items: {type: string}}
        createdAt: {type: string, format: date-time}
      description: >-
        tenantId는 서버 저장 소유 범위로 필수지만 권한 근거로 요청받거나 이 응답에 노출하지 않는다.
        caseVersion은 모든 Case 명령의 expectedCaseVersion과 비교한다.
        closureDisposition은 CLOSED에서만 기록한다. ISSUANCE_ABANDONED와
        NO_NEW_REPORT_AFTER_STALE은 발급 완료가 아니다. 후자는 서버가 V2 검토 revision,
        이전 STALE 승인 Decision과 과거 공식 PDF의 ReportVersion ID 목록(없으면 빈 배열)을
        이력에서 확정하고 closureReviewActivityId로 사전 검토 활동,
        closureActivityId로 별도 종료 감사를 연결한다.
    CasePage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, hasNext]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Case'}}
        page: {type: integer, minimum: 0}
        pageSize: {type: integer, minimum: 1, maximum: 100}
        hasNext: {type: boolean}
    CaseSourceReference:
      type: object
      additionalProperties: false
      required: [caseSourceReferenceId, sourceType, sourceRecordId, sourceVersion, eventId, linkedAt]
      allOf:
        - if: {properties: {sourceType: {const: FAN_REPORT}}, required: [sourceType]}
          then: {required: [fanReportId]}
        - if: {properties: {sourceType: {const: EVIDENCE_ASSET}}, required: [sourceType]}
          then: {required: [fanReportId]}
      properties:
        caseSourceReferenceId: {type: string, format: uuid}
        sourceType: {type: string, enum: [ANALYSIS_FINDING, FAN_REPORT, EVIDENCE_ASSET]}
        sourceRecordId: {type: string, format: uuid}
        sourceVersion: {type: integer, minimum: 1}
        eventId: {type: string, format: uuid}
        analysisRunId: {type: string, format: uuid}
        clusterId: {type: string, maxLength: 160}
        fanReportId: {type: string, format: uuid}
        linkedAt: {type: string, format: date-time}
        linkReason: {type: string}
      description: >-
        FAN_REPORT이면 sourceRecordId=fanReportId. EVIDENCE_ASSET이면
        sourceRecordId=evidenceId이고 fanReportId는 검증된 소속 제보다.
        파일 ID만으로 제보를 유추하지 않으며 tenant/event·소유 관계를 서버가 확인한다.
    EvidenceItem:
      type: object
      additionalProperties: false
      required: [itemId, kind, itemVersion, itemSha256, sourceType, sourceRecordId, sourceVersion]
      allOf:
        - if: {properties: {sourceType: {const: FAN_REPORT}}, required: [sourceType]}
          then: {required: [fanReportId]}
        - if: {properties: {sourceType: {const: EVIDENCE_ASSET}}, required: [sourceType]}
          then: {required: [evidenceId, fanReportId]}
      properties:
        itemId: {type: string, format: uuid}
        kind: {type: string, enum: [ORIGINAL_IMAGE, IMAGE_EXTRACTION, DATABASE_MATCH, GRAPH_FINDING, REVIEW_INPUT]}
        itemVersion: {type: integer, minimum: 1}
        itemSha256: {$ref: '#/components/schemas/Sha256'}
        sourceType: {type: string, enum: [ANALYSIS_FINDING, FAN_REPORT, EVIDENCE_ASSET]}
        sourceRecordId: {type: string, format: uuid, description: "FAN_REPORT는 fanReportId, EVIDENCE_ASSET은 evidenceId, ANALYSIS_FINDING은 findingId."}
        sourceVersion: {type: integer, minimum: 1}
        evidenceId: {type: string, format: uuid, description: 영속 증거 항목 ID. EVIDENCE_ASSET이면 sourceRecordId와 동일.}
        fanReportId: {type: string, format: uuid, description: FAN_REPORT 및 소속 EVIDENCE_ASSET의 영속 제보 ID.}
        objectVersion: {type: string, description: 원본 파일의 비공개 저장소 object version. object key는 노출하지 않음.}
        extractionId: {type: string, format: uuid}
        extractionRevision: {type: integer, minimum: 1}
        extractionModelVersion: {type: string}
        correctionRevision: {type: integer, minimum: 1}
        matchId: {type: string, format: uuid}
        matchRevision: {type: integer, minimum: 1}
        matchScopeSha256: {$ref: '#/components/schemas/Sha256'}
        analysisRunId: {type: string, format: uuid}
        algorithmVersion: {type: string}
        findingRevision: {type: integer, minimum: 1}
        judgementRevision: {type: integer, minimum: 1}
        summary: {type: string, maxLength: 1000}
      description: >-
        kind별 적용 가능한 선택 결과의 ID/버전을 서버가 immutable manifest에 기록한다.
        FAN_REPORT 항목은 fanReportId를, 그 제보의 EVIDENCE_ASSET 항목은 evidenceId와
        fanReportId를 함께 고정한다. ANALYSIS_FINDING에는 fanReportId가 필수가 아니다.
        서버는 존재하는 제보·증거의 실제 소속, Case와 출처의 tenant/event 범위를
        저장된 기록으로 확인한다. 다른 제보에 속한 evidenceId와 미존재 ID는 연결하지
        않으며 클라이언트가 전달한 ID만으로 소속을 확정하지 않는다.
        분석 실행·알고리즘 버전, 추출·수정·대조 버전은 선택된 근거에만 해당한다.
        민감 원문과 파일 object key는 응답과 승인 감사에 복제하지 않는다.
    CaseSources:
      type: object
      additionalProperties: false
      required: [caseId, evidenceRevision, sources, evidenceItems]
      properties:
        caseId: {type: string, format: uuid}
        evidenceRevision: {type: integer, minimum: 0}
        currentEvidenceSnapshotId: {type: string, format: uuid, readOnly: true}
        currentManifestSha256: {$ref: '#/components/schemas/Sha256'}
        sources: {type: array, items: {$ref: '#/components/schemas/CaseSourceReference'}}
        evidenceItems: {type: array, items: {$ref: '#/components/schemas/EvidenceItem'}}
      dependentRequired:
        currentEvidenceSnapshotId: [currentManifestSha256]
        currentManifestSha256: [currentEvidenceSnapshotId]
      description: >-
        현재 revision의 불변 snapshot이 있으면 서버가 현재 ID와 digest를 함께 제공한다.
        없으면 둘 다 생략한다. 검토 완료 명령은 서버 저장 현재 snapshot과 다시 비교하며
        클라이언트가 이 조회값을 제시했다는 사실만으로 검토 완료를 인정하지 않는다.
    CaseActivity:
      type: object
      additionalProperties: false
      required: [activityId, caseId, eventType, occurredAt, caseVersionAfter]
      allOf:
        - if: {properties: {closureDisposition: {const: NO_NEW_REPORT_AFTER_STALE}}, required: [closureDisposition]}
          then:
            required: [actorUserId, reason, noNewReportReason, fromStatus, toStatus, reviewActivityId, closureEvidenceRevision, closureStaleApprovalDecisionId, closurePriorGeneratedReportVersionIds, approvalAuditEventId]
            properties:
              eventType: {const: CASE_CLOSED}
              actorUserId: {type: string, format: uuid}
              fromStatus: {const: IN_REVIEW}
              toStatus: {const: CLOSED}
        - if: {properties: {eventType: {const: EVIDENCE_REVIEW_COMPLETED}}, required: [eventType]}
          then:
            required: [tenantId, eventId, actorUserId, reviewedBy, reviewedAt, evidenceRevision, evidenceSnapshotId, manifestSha256, reviewOutcome, reason]
            properties:
              reviewOutcome: {const: NO_NEW_REPORT}
      properties:
        activityId: {type: string, format: uuid}
        tenantId: {type: string, format: uuid, readOnly: true}
        eventId: {type: string, format: uuid, readOnly: true}
        caseId: {type: string, format: uuid}
        eventType: {type: string}
        actorUserId: {type: [string, 'null'], format: uuid}
        occurredAt: {type: string, format: date-time}
        reason: {type: string}
        fromStatus: {$ref: '#/components/schemas/CaseStatus'}
        toStatus: {$ref: '#/components/schemas/CaseStatus'}
        caseVersionAfter: {type: integer, minimum: 0}
        approvalAuditEventId: {type: string, format: uuid}
        requestId: {type: string, format: uuid}
        evidenceRevision: {type: integer, minimum: 1}
        evidenceSnapshotId: {type: string, format: uuid}
        manifestSha256: {$ref: '#/components/schemas/Sha256'}
        reviewedBy: {type: string, format: uuid, readOnly: true}
        reviewedAt: {type: string, format: date-time, readOnly: true}
        reviewOutcome: {type: string, enum: [NO_NEW_REPORT]}
        reviewActivityId: {type: string, format: uuid, description: 종료 활동에서 참조하는 이전 EVIDENCE_REVIEW_COMPLETED activityId.}
        closureDisposition: {type: string, enum: [GENERATED_REPORT, ISSUANCE_ABANDONED, NO_NEW_REPORT_AFTER_STALE, NOT_APPLICABLE]}
        noNewReportReason: {type: string, minLength: 3, maxLength: 2000}
        closureEvidenceRevision: {type: integer, minimum: 1}
        closureStaleApprovalDecisionId: {type: string, format: uuid}
        closurePriorGeneratedReportVersionIds: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
      description: >-
        EVIDENCE_REVIEW_COMPLETED의 activityId가 계약상 caseActivityId이며 저장된 인증
        REVIEWER actorUserId=reviewedBy, 서버 occurredAt=reviewedAt이다. 검토 활동은
        종료 명령보다 먼저 확정되어야 하고 조회·메모·종료 명령으로 생성하지 않는다.
        NO_NEW_REPORT_AFTER_STALE 종료 활동은 별도의 종료·신규 미발급 사유, V2 revision,
        사전 reviewActivityId, 이전 불변 승인 Decision과 과거 공식 PDF ReportVersion ID 목록(없으면 빈 배열),
        연결된 ApprovalAuditEvent를 보존한다. 증거/개인정보 원문은 감사에 복제하지 않는다.
    CaseActivityPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, hasNext]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CaseActivity'}}
        page: {type: integer, minimum: 0}
        pageSize: {type: integer, minimum: 1, maximum: 100}
        hasNext: {type: boolean}
    EvidenceSnapshot:
      type: object
      additionalProperties: false
      required: [evidenceSnapshotId, tenantId, caseId, caseVersionAtCapture, evidenceRevision, capturedAt, manifestSchemaVersion, manifestSha256, items]
      properties:
        evidenceSnapshotId: {type: string, format: uuid}
        tenantId: {type: string, format: uuid, readOnly: true}
        caseId: {type: string, format: uuid}
        caseVersionAtCapture: {type: integer, minimum: 0}
        evidenceRevision: {type: integer, minimum: 0}
        capturedAt: {type: string, format: date-time}
        manifestSchemaVersion: {type: integer, minimum: 1}
        manifestSha256: {$ref: '#/components/schemas/Sha256'}
        items: {type: array, minItems: 1, items: {$ref: '#/components/schemas/EvidenceItem'}}
      description: >-
        tenantId는 서버 저장 manifest에서 결정한 읽기 전용 소유 범위이며 인증된 tenant/event와 대조한다.
        items의 출처 타입·ID와 팬 제보/증거 소속 관계는 불변 manifest 및 digest에 포함한다.
        이 응답은 민감 원문·object key를 제외한 불변 manifest 투영이다.
        전체 canonical manifest의 digest는 서버가 저장·검증한다. 보고서 내용/템플릿은 별도 ReportVersion.
    CompleteEvidenceReviewInput:
      type: object
      additionalProperties: false
      required: [expectedCaseVersion, evidenceRevision, evidenceSnapshotId, manifestSha256, reviewOutcome, reason]
      properties:
        expectedCaseVersion: {type: integer, minimum: 0}
        evidenceRevision: {type: integer, minimum: 1}
        evidenceSnapshotId: {type: string, format: uuid}
        manifestSha256: {$ref: '#/components/schemas/Sha256'}
        reviewOutcome: {type: string, const: NO_NEW_REPORT}
        reason: {type: string, minLength: 3, maxLength: 2000}
      description: >-
        서버 인증 문맥의 REVIEWER만 제출한다. tenantId·eventId·reviewedBy·reviewedAt은
        클라이언트가 보내지 않고 서버가 저장한다. 서버 현재 V2 revision·snapshot ID/hash,
        증거 변경에 따른 과거 승인 STALE, Case IN_REVIEW, ACTIVE 보류 부재를 확인한다.
        응답의 activityId는 별도 종료 명령의 reviewActivityId로 사용한다.
    CaseTransitionInput:
      type: object
      additionalProperties: false
      required: [toStatus, expectedCaseVersion, reason]
      allOf:
        - if: {properties: {toStatus: {const: CLOSED}}, required: [toStatus]}
          then: {required: [closureDisposition]}
        - if: {properties: {closureDisposition: {const: GENERATED_REPORT}}, required: [closureDisposition]}
          then: {required: [closureReportVersionId]}
        - if: {properties: {closureDisposition: {const: ISSUANCE_ABANDONED}}, required: [closureDisposition]}
          then: {required: [issuanceAbandonmentReason]}
        - if: {properties: {closureDisposition: {const: NO_NEW_REPORT_AFTER_STALE}}, required: [closureDisposition]}
          then:
            required: [reviewActivityId, reviewedEvidenceRevision, noNewReportReason]
            properties: {toStatus: {const: CLOSED}}
      properties:
        toStatus:
          type: string
          enum: [TRIAGED, IN_REVIEW, NEEDS_EVIDENCE, READY_FOR_APPROVAL, DISMISSED, CLOSED]
        expectedCaseVersion: {type: integer, minimum: 0}
        reason: {type: string, minLength: 3, maxLength: 2000}
        closureDisposition: {type: string, enum: [GENERATED_REPORT, ISSUANCE_ABANDONED, NO_NEW_REPORT_AFTER_STALE, NOT_APPLICABLE]}
        closureReportVersionId: {type: string, format: uuid}
        issuanceAbandonmentReason: {type: string, minLength: 3, maxLength: 2000}
        reviewActivityId: {type: string, format: uuid, description: 종료 전에 저장된 EVIDENCE_REVIEW_COMPLETED activityId.}
        reviewedEvidenceRevision: {type: integer, minimum: 1, description: REVIEWER가 재검토한 현재 Case.evidenceRevision과 일치해야 한다.}
        noNewReportReason: {type: string, minLength: 3, maxLength: 2000}
      description: >-
        READY_FOR_APPROVAL의 PENDING 요청이 없을 때 IN_REVIEW/NEEDS_EVIDENCE 복귀 가능.
        PENDING이면 철회·반려·시스템 무효화가 먼저 Request와 Case를 원자 처리한다.
        IN_REVIEW의 CLOSED는 V2 재검토·이전 승인 STALE 조건에서
        NO_NEW_REPORT_AFTER_STALE만 허용한다. REVIEWER가 사전 검토 활동의
        reviewActivityId·reviewedEvidenceRevision·별도 noNewReportReason을 제출한다.
        서버는 그 활동이 종료 전에 확정됐고 같은 tenant/event/Case·현재 revision·
        snapshot ID/hash·당시 REVIEWER 권한·NO_NEW_REPORT에 묶였는지, 이전 승인
        Decision이 증거 revision 증가로 STALE인지 확인한다. ReportVersion 내용 변경만으로
        STALE인 경우에는 이 분기를 사용할 수 없다.
        APPROVED_FOR_REPORT의 CLOSED는 GENERATED_REPORT 또는 ISSUANCE_ABANDONED만,
        DISMISSED의 CLOSED는 근거 있는 기각에서 NOT_APPLICABLE만 허용한다.
        모든 CLOSED에서 ACTIVE 보류·렌더 예약·PENDING 요청은 거절한다.
    IssuanceHold:
      type: object
      x-internal-only: true
      additionalProperties: false
      required: [holdId, tenantId, eventId, caseId, reasonCode, status, createdAt, createdBy, evidenceRevisionAtOpen, createdAuditEventId]
      properties:
        holdId: {type: string, format: uuid}
        tenantId: {type: string, format: uuid, readOnly: true}
        eventId: {type: string, format: uuid, readOnly: true}
        caseId: {type: string, format: uuid}
        reasonCode: {type: string, enum: [NEW_IMPORTANT_INFORMATION, CONTRADICTORY_EVIDENCE, SOURCE_INTEGRITY_CONCERN, OTHER]}
        status: {type: string, enum: [ACTIVE, RELEASED]}
        createdAt: {type: string, format: date-time}
        createdBy: {type: string, description: 인증된 사용자 ID 또는 SYSTEM 이벤트 ID.}
        evidenceRevisionAtOpen: {type: integer, minimum: 0}
        createdAuditEventId: {type: string, format: uuid}
        resolvedBy: {type: string}
        resolvedAt: {type: string, format: date-time}
        resolutionReason: {type: string}
        evidenceRevisionAtResolution: {type: integer, minimum: 0}
        resolvedAuditEventId: {type: string, format: uuid}
      description: >-
        서버 저장 발급 통제 상태. 공개 등록·해제 API는 아직 제안하지 않는다.
        ACTIVE는 승인 결정·발급 예약·PDF 공개를 막는다. 관련성 검토와 감사 없이는 해제 불가.
    AssignCaseInput:
      type: object
      additionalProperties: false
      required: [assigneeUserId, expectedCaseVersion, reason]
      properties:
        assigneeUserId: {type: string, format: uuid}
        expectedCaseVersion: {type: integer, minimum: 0}
        reason: {type: string, minLength: 3, maxLength: 2000}
    ReportVersionStatus:
      type: string
      description: >-
        Specs 04의 ReportVersion 상태에 WITHDRAWN/INVALIDATED를 추가한 MVP 제안.
        Case 및 ApprovalRequest 상태와 다르다. SUPERSEDED는 새 공식 PDF가 GENERATED로
        공개된 뒤 이전 GENERATED에만 적용하며 STALE과 동의어가 아니다.
      enum: [DRAFT, PENDING_APPROVAL, APPROVED, REJECTED, WITHDRAWN, INVALIDATED, RENDERING, GENERATED, GENERATION_FAILED, SUPERSEDED]
    ReportVersion:
      type: object
      additionalProperties: false
      required: [reportVersionId, caseId, revision, version, status, evidenceSnapshotId, evidenceRevision, manifestSha256, contentSha256, templateVersion, createdAt, approvalEligibility]
      properties:
        reportVersionId: {type: string, format: uuid}
        caseId: {type: string, format: uuid}
        revision: {type: integer, minimum: 1, description: 봉인된 내용 revision. 내용 수정 시 새 revision/ID.}
        version: {type: integer, minimum: 0, description: 상태 변경용 optimistic lock. expectedReportVersion과 비교.}
        status: {$ref: '#/components/schemas/ReportVersionStatus'}
        evidenceSnapshotId: {type: string, format: uuid}
        evidenceRevision: {type: integer, minimum: 0}
        manifestSha256: {$ref: '#/components/schemas/Sha256'}
        contentSha256: {$ref: '#/components/schemas/Sha256'}
        templateVersion: {type: string}
        createdAt: {type: string, format: date-time}
        approvalDecisionId: {type: string, format: uuid}
        pdfSha256: {$ref: '#/components/schemas/Sha256'}
        generatedAt: {type: string, format: date-time}
        failureCode: {type: string}
        approvalEligibility: {type: string, enum: [CURRENT, STALE, NOT_APPROVED], readOnly: true, description: 승인 근거·내용 바인딩. CURRENT여도 ACTIVE 보류나 CLOSED이면 신규 발급 불가.}
      description: >-
        tenantId는 서버 저장 소유 범위에 필수. 생성 시 봉인된 내용·템플릿·snapshot 참조는
        이후 불변이며 GENERATED의 PDF bytes도 불변이다. revision과 version은 별개다.
        RENDERING 중 정책 보류로 공개가 차단되면 APPROVED로 되돌리고 별도 감사한다.
    CreateReportVersionInput:
      type: object
      additionalProperties: false
      required: [evidenceSnapshotId, templateVersion, expectedCaseVersion, reason]
      properties:
        evidenceSnapshotId: {type: string, format: uuid}
        templateVersion: {type: string, minLength: 1}
        expectedCaseVersion: {type: integer, minimum: 0}
        reason: {type: string, minLength: 3, maxLength: 2000}
      description: >-
        서버가 선택된 보고서 입력을 snapshot과 결합해 봉인하고 contentSha256을 계산한다.
        원문 증거/보고서 내용은 이 API 예제에 포함하지 않는다.
    SubmitApprovalInput:
      type: object
      additionalProperties: false
      required: [reportVersionId, evidenceSnapshotId, expectedCaseVersion, expectedReportVersion, expectedReportContentSha256, reason]
      properties:
        reportVersionId: {type: string, format: uuid}
        evidenceSnapshotId: {type: string, format: uuid}
        expectedCaseVersion: {type: integer, minimum: 0}
        expectedReportVersion: {type: integer, minimum: 0, description: ReportVersion.version과 비교; 내용 revision이 아님.}
        expectedReportContentSha256: {$ref: '#/components/schemas/Sha256'}
        reason: {type: string, minLength: 3, maxLength: 2000}
    ApprovalRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, WITHDRAWN, INVALIDATED]
    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [approvalRequestId, caseId, reportVersionId, reportRevision, reportContentSha256, reportTemplateVersion, requestedBy, requestedAt, evidenceSnapshotId, evidenceRevision, manifestSha256, reason, status, caseVersionAtSubmit, version, approvalEligibility]
      properties:
        approvalRequestId: {type: string, format: uuid}
        caseId: {type: string, format: uuid}
        reportVersionId: {type: string, format: uuid}
        reportRevision: {type: integer, minimum: 1}
        reportContentSha256: {$ref: '#/components/schemas/Sha256'}
        reportTemplateVersion: {type: string}
        requestedBy: {type: string, format: uuid}
        requestedAt: {type: string, format: date-time}
        evidenceSnapshotId: {type: string, format: uuid}
        evidenceRevision: {type: integer, minimum: 0}
        manifestSha256: {$ref: '#/components/schemas/Sha256'}
        reason: {type: string}
        status: {$ref: '#/components/schemas/ApprovalRequestStatus'}
        caseVersionAtSubmit: {type: integer, minimum: 0}
        version: {type: integer, minimum: 0, description: Request 상태 optimistic lock. expectedRequestVersion과 비교.}
        withdrawnAt: {type: string, format: date-time}
        withdrawalReason: {type: string}
        withdrawalAuditEventId: {type: string, format: uuid}
        approvalEligibility: {type: string, enum: [CURRENT, STALE, NOT_APPLICABLE], readOnly: true}
    ApprovalDecision:
      type: object
      additionalProperties: false
      required: [approvalDecisionId, approvalRequestId, decidedBy, decision, reason, decidedAt, reviewedEvidenceSnapshotId, reviewedManifestSha256, reviewedReportContentSha256, reviewReceiptId, approvalAuditEventId]
      properties:
        approvalDecisionId: {type: string, format: uuid}
        approvalRequestId: {type: string, format: uuid}
        decidedBy: {type: string, format: uuid}
        decision: {type: string, enum: [APPROVE, REJECT]}
        reason: {type: string}
        decidedAt: {type: string, format: date-time}
        reviewedEvidenceSnapshotId: {type: string, format: uuid}
        reviewedManifestSha256: {$ref: '#/components/schemas/Sha256'}
        reviewedReportContentSha256: {$ref: '#/components/schemas/Sha256'}
        reviewReceiptId: {type: string, format: uuid, readOnly: true, description: 사용·소비된 서버 영수증 기록 ID. 원문 토큰이 아님.}
        approvalAuditEventId: {type: string, format: uuid}
    ReviewReceipt:
      type: object
      x-internal-only: true
      additionalProperties: false
      required: [reviewReceiptId, tokenSha256, approverUserId, tenantId, eventId, caseId, approvalRequestId, evidenceSnapshotId, manifestSha256, reportVersionId, reportContentSha256, issuedAt, expiresAt, status]
      properties:
        reviewReceiptId: {type: string, format: uuid}
        tokenSha256: {$ref: '#/components/schemas/Sha256'}
        approverUserId: {type: string, format: uuid}
        tenantId: {type: string, format: uuid}
        eventId: {type: string, format: uuid}
        caseId: {type: string, format: uuid}
        approvalRequestId: {type: string, format: uuid}
        evidenceSnapshotId: {type: string, format: uuid}
        manifestSha256: {$ref: '#/components/schemas/Sha256'}
        reportVersionId: {type: string, format: uuid}
        reportContentSha256: {$ref: '#/components/schemas/Sha256'}
        issuedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        status: {type: string, enum: [ISSUED, CONSUMED, REVOKED, EXPIRED]}
        consumedAt: {type: string, format: date-time}
        approvalDecisionId: {type: string, format: uuid}
      description: >-
        서버 내부 기록. 제한 TTL(초기 권장 15분, 운영 설정값 미확정)이 지나면 사용할 수 없다.
        근거/보고서 변경, ACTIVE 보류 등록, 요청 철회·무효화 시 REVOKED 처리하거나
        같은 범위 검사로 사용 불가.
        원문 토큰은 저장·로그·감사에 남기지 않는다. 결정당 한 번만 원자 소비한다.
    ApprovalRequestDetail:
      type: object
      additionalProperties: false
      required: [request, reportVersion]
      properties:
        request: {$ref: '#/components/schemas/ApprovalRequest'}
        decision: {$ref: '#/components/schemas/ApprovalDecision'}
        reportVersion: {$ref: '#/components/schemas/ReportVersion'}
    ApprovalReviewPackageView:
      type: object
      additionalProperties: false
      required: [request, reportVersion, snapshot, sealedReportContent]
      properties:
        request: {$ref: '#/components/schemas/ApprovalRequest'}
        reportVersion: {$ref: '#/components/schemas/ReportVersion'}
        snapshot: {$ref: '#/components/schemas/EvidenceSnapshot'}
        sealedReportContent:
          type: object
          description: >-
            서버가 봉인한 정확한 보고서 입력의 승인자 전용 canonical JSON.
            고객사·공연·역할 검증 후에만 제공하며 영수증 토큰은 포함하지 않는다.
    ApprovalReviewPackage:
      type: object
      additionalProperties: false
      required: [request, reportVersion, snapshot, sealedReportContent, reviewReceiptToken, issuedAt, expiresAt]
      properties:
        request: {$ref: '#/components/schemas/ApprovalRequest'}
        reportVersion: {$ref: '#/components/schemas/ReportVersion'}
        snapshot: {$ref: '#/components/schemas/EvidenceSnapshot'}
        sealedReportContent:
          type: object
          description: >-
            서버가 봉인한 정확한 보고서 입력의 승인자 전용 canonical JSON. ReportVersion.contentSha256의
            대상이며 고객사·공연·역할 검증 후에만 제공하고 로그/감사에 원문 복제 금지.
        reviewReceiptToken: {type: string, minLength: 32, description: 서버가 한 번 전달하는 고엔트로피 불투명 토큰. 인증 자체를 대체하지 않음.}
        issuedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
      description: >-
        서버 저장 ReviewReceipt는 인증 actor/tenant/event/Case/Request/ReportVersion ID·digest/
        snapshot ID·digest에 묶인다. 결정 시 다시 비교하며 패키지 수령만으로 사람의 이해를
        증명하지 않는다. 원문 토큰을 로그·감사에 기록하지 않는다.
    DecideApprovalInput:
      type: object
      additionalProperties: false
      required: [decision, reason, reviewedEvidenceSnapshotId, reviewedManifestSha256, reviewedReportContentSha256, reviewReceiptToken, reviewConfirmed, expectedCaseVersion, expectedRequestVersion, expectedReportVersion]
      properties:
        decision: {type: string, enum: [APPROVE, REJECT]}
        reason: {type: string, minLength: 3, maxLength: 2000}
        reviewedEvidenceSnapshotId: {type: string, format: uuid}
        reviewedManifestSha256: {$ref: '#/components/schemas/Sha256'}
        reviewedReportContentSha256: {$ref: '#/components/schemas/Sha256'}
        reviewReceiptToken: {type: string, minLength: 32, writeOnly: true, description: 명시적 POST 발급 응답에서 받은 일회용 토큰. 서버 저장 digest로 검증.}
        reviewConfirmed: {type: boolean, const: true}
        expectedCaseVersion: {type: integer, minimum: 0}
        expectedRequestVersion: {type: integer, minimum: 0}
        expectedReportVersion: {type: integer, minimum: 0, description: ReportVersion.version과 비교.}
    DecisionResult:
      type: object
      additionalProperties: false
      required: [request, decision, case, reportVersion]
      properties:
        request: {$ref: '#/components/schemas/ApprovalRequest'}
        decision: {$ref: '#/components/schemas/ApprovalDecision'}
        case: {$ref: '#/components/schemas/Case'}
        reportVersion: {$ref: '#/components/schemas/ReportVersion'}
    WithdrawApprovalInput:
      type: object
      additionalProperties: false
      required: [reason, expectedCaseVersion, expectedRequestVersion, expectedReportVersion]
      properties:
        reason: {type: string, minLength: 3, maxLength: 2000}
        expectedCaseVersion: {type: integer, minimum: 0}
        expectedRequestVersion: {type: integer, minimum: 0}
        expectedReportVersion: {type: integer, minimum: 0}
    WithdrawalResult:
      type: object
      additionalProperties: false
      required: [request, case, reportVersion, withdrawnAt, approvalAuditEventId]
      properties:
        request: {$ref: '#/components/schemas/ApprovalRequest'}
        case: {$ref: '#/components/schemas/Case'}
        reportVersion: {$ref: '#/components/schemas/ReportVersion'}
        withdrawnAt: {type: string, format: date-time}
        approvalAuditEventId: {type: string, format: uuid}
    RenderReportInput:
      type: object
      additionalProperties: false
      required: [expectedCaseVersion, expectedReportVersion, expectedEvidenceRevision, expectedReportContentSha256]
      properties:
        expectedCaseVersion: {type: integer, minimum: 0}
        expectedReportVersion: {type: integer, minimum: 0}
        expectedEvidenceRevision: {type: integer, minimum: 0}
        expectedReportContentSha256: {$ref: '#/components/schemas/Sha256'}
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, requestId]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {type: string}
        detail: {type: string}
        requestId: {type: string}
        violations:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: {type: string}
              message: {type: string}
      example:
        type: about:blank
        title: Conflict
        status: 409
        code: EVIDENCE_VERSION_MISMATCH
        detail: 현재 근거 버전과 승인된 스냅샷이 일치하지 않습니다.
        requestId: 88888888-8888-4888-8888-888888888888
