openapi: 3.1.0
x-contract-status: PROPOSED_UNIMPLEMENTED
x-w08a-implemented-contract: case-w08a-v1.yaml
info:
  title: Ticket Defender Case and Approval API (PROPOSAL)
  version: 0.1.0
  description: >-
    MVP 정책을 반영한 문서 전용 PROPOSED 초안. 아래 경로는 현재 Spring Backend에 구현되어 있지 않다.
    기존 /api/v1/audits/** 경로를 바꾸거나 공식 PDF 발급을 허용하지 않는다.
    인증, tenant membership, 공연 범위, 파일 접근 통제가 구현되기 전 활성화 금지.
    tenantId는 요청에서 받지 않고 인증된 서버 문맥에서 결정한다.
    Specs 관리자 API도 PROPOSED이며 같은 Case 경로의 필드명과 구 ReportVersion
    approve 경로는 docs/issues/case-approval-decisions-followups.md의 동기화 대상이다.
servers:
  - url: http://localhost:8080
    description: 제안 경로 설명용. 가동 중인 API라는 뜻이 아님.
security:
  - userAuth: []
x-tenant-boundary:
  source: authenticated server membership, never request tenantId
  resources: [Case, CaseSourceReference, CaseActivity, EvidenceSnapshot, IssuanceHold, ReviewReceipt, ApprovalRequest, ApprovalDecision, ReportVersion, PDF]
  crossTenantOrHiddenEvent: 404 RESOURCE_NOT_FOUND
  sameTenantRoleDenied: 403 FORBIDDEN
tags:
  - name: Cases
  - name: Approvals
  - name: Reports
x-error-catalog:
  '400': [INVALID_REQUEST]
  '401': [UNAUTHENTICATED]
  '403': [FORBIDDEN, SELF_APPROVAL_FORBIDDEN]
  '404': [RESOURCE_NOT_FOUND]
  '409': [CASE_STATE_CONFLICT, CASE_VERSION_CONFLICT, APPROVAL_REQUEST_ALREADY_PENDING, APPROVAL_ALREADY_DECIDED, APPROVAL_REQUEST_NOT_PENDING, IDEMPOTENCY_KEY_REUSED, EVIDENCE_VERSION_MISMATCH, EVIDENCE_REVIEW_NOT_COMPLETED, EVIDENCE_REVIEW_MISMATCH, REPORT_CONTENT_MISMATCH, REPORT_VERSION_CONFLICT, REPORT_REVISION_CLOSED, REPORT_NOT_APPROVED, REPORT_NOT_GENERATED, REPORT_ALREADY_GENERATED, REPORT_RENDER_IN_PROGRESS, ISSUANCE_HOLD_ACTIVE, REVIEW_RECEIPT_MISMATCH, REVIEW_RECEIPT_UNUSABLE]
  '422': [VALIDATION_FAILED]
  '500': [INTERNAL_ERROR]
  '503': [DEPENDENCY_UNAVAILABLE]
paths:
  /api/v1/cases:
    post:
      tags: [Cases]
      operationId: createCaseProposal
      x-required-roles: [ANALYST, REVIEWER]
      summary: Case 또는 연결된 후속 Case 생성
      description: >-
        ANALYST 또는 REVIEWER의 명시적 생성. 종료 Case의 직접 재개는 없으며
        후속 Case는 relatedCaseId와 relationReason을 함께 제공한다.
        FAN_REPORT는 영속 fanReportIds가 필요하며 evidenceIds만으로 제보를 추정하지 않는다.
        서버가 제보·증거의 tenant/event 및 소유 관계를 검사한다.
        원 Case의 승인·보고서·감사 이력은 복제하거나 승계하지 않는다.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCaseInput'}
            example:
              eventId: 33333333-3333-4333-8333-333333333333
              type: FAN_REPORT
              fanReportIds: [22222222-2222-4222-8222-222222222222]
              evidenceIds: [88888888-8888-4888-8888-888888888888]
              reason: '동일 공연의 제보와 증거를 연결'
      responses:
        '201':
          description: 새 OPEN Case. 같은 키·같은 본문 재전송은 저장된 같은 응답.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Case'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      tags: [Cases]
      operationId: listCasesProposal
      x-required-roles: [TENANT_ADMIN, ANALYST, REVIEWER, APPROVER, AUDITOR]
      summary: 권한 범위의 Case 목록 조회
      description: tenant와 공연 접근 범위를 서버에서 강제한다. 분석 실패는 빈 결과로 바꾸지 않는다.
      parameters:
        - {name: eventId, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/CaseStatus'}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 권한 범위에 속하는 Case 페이지
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CasePage'}
              example:
                items:
                  - caseId: 11111111-1111-4111-8111-111111111111
                    eventId: 33333333-3333-4333-8333-333333333333
                    status: IN_REVIEW
                    type: GRAPH_CLUSTER
                    caseVersion: 4
                    evidenceRevision: 2
                    hasActiveIssuanceHold: false
                    allowedActions: [VIEW_SOURCES, VIEW_ACTIVITIES]
                    createdAt: '2026-10-17T01:00:00Z'
                page: 0
                pageSize: 20
                hasNext: false
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/cases/{caseId}:
    get:
      tags: [Cases]
      operationId: getCaseProposal
      x-required-roles: [TENANT_ADMIN, ANALYST, REVIEWER, APPROVER, AUDITOR]
      summary: Case 상세 조회
      parameters: [{$ref: '#/components/parameters/CaseId'}]
      responses:
        '200':
          description: 현재 상태와 서버가 계산한 허용 행위
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Case'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/cases/{caseId}/sources:
    get:
      tags: [Cases]
      operationId: listCaseSourcesProposal
      x-required-roles: [TENANT_ADMIN, ANALYST, REVIEWER, APPROVER, AUDITOR]
      summary: Case 출처와 현재 근거 메타데이터 조회
      description: >-
        FAN_REPORT의 fanReportId와 소속 EVIDENCE_ASSET의 evidenceId를 구분한다.
        비공개 파일 원본·직접 URL은 반환하지 않는다.
      parameters: [{$ref: '#/components/parameters/CaseId'}]
      responses:
        '200':
          description: 연결 출처와 근거 버전
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaseSources'}
              example:
                caseId: 11111111-1111-4111-8111-111111111111
                evidenceRevision: 2
                currentEvidenceSnapshotId: 77777777-7777-4777-8777-777777777777
                currentManifestSha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                sources:
                  - caseSourceReferenceId: 44444444-4444-4444-8444-444444444444
                    sourceType: ANALYSIS_FINDING
                    sourceRecordId: 55555555-5555-4555-8555-555555555555
                    sourceVersion: 1
                    eventId: 33333333-3333-4333-8333-333333333333
                    analysisRunId: 66666666-6666-4666-8666-666666666666
                    clusterId: cluster-demo-01
                    linkedAt: '2026-10-17T01:05:00Z'
                  - caseSourceReferenceId: 12121212-1212-4212-8212-121212121212
                    sourceType: FAN_REPORT
                    sourceRecordId: 22222222-2222-4222-8222-222222222222
                    fanReportId: 22222222-2222-4222-8222-222222222222
                    sourceVersion: 1
                    eventId: 33333333-3333-4333-8333-333333333333
                    linkedAt: '2026-10-17T01:06:00Z'
                  - caseSourceReferenceId: 13131313-1313-4313-8313-131313131313
                    sourceType: EVIDENCE_ASSET
                    sourceRecordId: 88888888-8888-4888-8888-888888888888
                    fanReportId: 22222222-2222-4222-8222-222222222222
                    sourceVersion: 1
                    eventId: 33333333-3333-4333-8333-333333333333
                    linkedAt: '2026-10-17T01:06:00Z'
                evidenceItems:
                  - itemId: 90909090-9090-4090-8090-909090909090
                    kind: ORIGINAL_IMAGE
                    itemVersion: 1
                    itemSha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
                    sourceType: EVIDENCE_ASSET
                    sourceRecordId: 88888888-8888-4888-8888-888888888888
                    sourceVersion: 1
                    evidenceId: 88888888-8888-4888-8888-888888888888
                    fanReportId: 22222222-2222-4222-8222-222222222222
                  - itemId: 91919191-9191-4191-8191-919191919191
                    kind: GRAPH_FINDING
                    itemVersion: 1
                    itemSha256: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
                    sourceType: ANALYSIS_FINDING
                    sourceRecordId: 55555555-5555-4555-8555-555555555555
                    sourceVersion: 1
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/cases/{caseId}/activities:
    get:
      tags: [Cases]
      operationId: listCaseActivitiesProposal
      x-required-roles: [TENANT_ADMIN, ANALYST, REVIEWER, APPROVER, AUDITOR]
      summary: Case 활동 이력 조회
      parameters:
        - {$ref: '#/components/parameters/CaseId'}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 감사 추적 가능한 append-only 활동 페이지
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaseActivityPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/cases/{caseId}/evidence-snapshots/{evidenceSnapshotId}:
    get:
      tags: [Cases]
      operationId: getEvidenceSnapshotProposal
      x-required-roles: [TENANT_ADMIN, ANALYST, REVIEWER, APPROVER, AUDITOR]
      summary: 불변 증거 manifest 메타데이터 조회
      parameters:
        - {$ref: '#/components/parameters/CaseId'}
        - {$ref: '#/components/parameters/EvidenceSnapshotId'}
      responses:
        '200':
          description: 특정 Case의 불변 manifest 메타데이터 투영. 원본 object key와 민감 원문은 제외.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidenceSnapshot'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/cases/{caseId}/evidence-review-completions:
    post:
      tags: [Cases]
      operationId: completeCaseEvidenceReviewProposal
      x-required-roles: [REVIEWER]
      summary: V2 증거의 사전 검토 완료 활동 기록
      description: >-
        PROPOSED/미구현. 권한 있는 REVIEWER의 명시적 NO_NEW_REPORT 검토 완료 명령이다.
        서버는 인증 tenant/event/Case와 당시 REVIEWER 권한, IN_REVIEW 상태, 이전 불변
        승인 Decision이 증거 revision 증가로 STALE인지, 현재 활성 불변 snapshot의
        ID·manifest digest·revision과 ACTIVE IssuanceHold 부재를 검사한다.
        현재 snapshot이 없거나 제출 바인딩과 다르면 409다. CaseActivity
        EVIDENCE_REVIEW_COMPLETED 저장과 caseVersion 증가는 한 트랜잭션이다.
        재시도에도 현재 인증·tenant/event 접근 범위를 검사한다. 같은 actor/tenant/operation의
        동일 멱등 키·본문은 이미 저장된 활동/응답을 반환하고
        다른 본문은 409 IDEMPOTENCY_KEY_REUSED다. GET·운영 메모·종료 명령은 이 활동을
        만들지 않는다. 상태 전이와 ApprovalRequest/Decision 생성은 하지 않는다.
      parameters:
        - {$ref: '#/components/parameters/CaseId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompleteEvidenceReviewInput'}
            example:
              expectedCaseVersion: 7
              evidenceRevision: 2
              evidenceSnapshotId: 77777777-7777-4777-8777-777777777777
              manifestSha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              reviewOutcome: NO_NEW_REPORT
              reason: 'V2 반대 증거를 재검토하고 새 공식 보고서를 발급하지 않기로 결정했습니다.'
      responses:
        '201':
          description: 사전에 확정된 append-only 검토 활동. 동일 멱등 요청 재시도는 이 저장 결과를 반환.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaseActivity'}
              example:
                activityId: 99999999-9999-4999-8999-999999999999
                tenantId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                eventId: 33333333-3333-4333-8333-333333333333
                caseId: 11111111-1111-4111-8111-111111111111
                eventType: EVIDENCE_REVIEW_COMPLETED
                actorUserId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                reviewedBy: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                occurredAt: '2026-10-17T01:55:00Z'
                reviewedAt: '2026-10-17T01:55:00Z'
                caseVersionAfter: 8
                evidenceRevision: 2
                evidenceSnapshotId: 77777777-7777-4777-8777-777777777777
                manifestSha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                reviewOutcome: NO_NEW_REPORT
                reason: 'V2 반대 증거를 재검토하고 새 공식 보고서를 발급하지 않기로 결정했습니다.'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/cases/{caseId}/transitions:
    post:
      tags: [Cases]
      operationId: transitionCaseProposal
      x-required-roles: [REVIEWER]
      summary: Case 업무 상태 변경 계약
      description: >-
        REVIEWER만 수행. APPROVED_FOR_REPORT는 결정 명령으로만 전이하며
        CLOSED/DISMISSED를 재개할 수 없다. APPROVED_FOR_REPORT에서 IN_REVIEW로의
        복귀는 증거/보고서 revision을 바꾸는 시스템 명령으로만 처리한다.
        READY_FOR_APPROVAL에 PENDING 요청이 없으면 사유와 함께 IN_REVIEW 또는
        NEEDS_EVIDENCE로 복귀할 수 있다. PENDING이면 이 경로로 우회할 수 없고 먼저
        철회/반려/시스템 무효화가 Request·ReportVersion과 Case 복귀를 원자 처리한다.
        CLOSED에는 closureDisposition이 필수다. IN_REVIEW에서는 V2 근거 재검토 후
        이전 승인 적격성이 STALE이고 신규 공식 보고서를 발급하지 않는 경우에만
        NO_NEW_REPORT_AFTER_STALE로 종료한다. reviewedEvidenceRevision은 현재 Case
        revision과 일치하고 과거 승인 snapshot보다 커야 하며 noNewReportReason은
        종료 reason과 별도로 기록한다. 종료 전에 확정된 reviewActivityId가 현재
        snapshot ID/hash·revision, tenant/event/Case, 당시 REVIEWER와 NO_NEW_REPORT에
        일치해야 한다. 검토 활동 없이 종료 명령 안에서 새로 만들 수 없다.
        ReportVersion 본문 변경만으로 STALE인 경우에는 이 종료 분기를 허용하지 않는다.
        이전 Decision·PDF 참조는 서버 이력에서 조회한다.
        APPROVED_FOR_REPORT는 현재 생성 PDF가
        공식 공개된 GENERATED_REPORT 또는 별도 사유의 ISSUANCE_ABANDONED만 허용하며
        DISMISSED는 근거 있는 기각에서 NOT_APPLICABLE만 허용한다. STALE 또는 발급 포기만으로
        DISMISSED를 선택할 수 없다. 모든 종료에서 ACTIVE 발급 보류·렌더 예약·PENDING 요청이
        없어야 한다. 종료·CaseActivity·감사를 원자 기록하며 실패 시 전체 롤백한다.
        종료 후 신규 렌더는 금지한다. NO_NEW_REPORT_AFTER_STALE 종료에서는 먼저 인증과
        tenant/event/Case 접근 범위를 검증한다. 접근 가능한 Case의 expectedCaseVersion과
        현재 Case.caseVersion이 다르면 409 CASE_VERSION_CONFLICT, 다음
        reviewedEvidenceRevision과 현재 Case.evidenceRevision이 다르면 409
        EVIDENCE_VERSION_MISMATCH다. 그 다음 검토 활동 ID를 허용된 tenant/event/Case
        범위에서 조회하며 미존재·타 범위는 동일한 404 RESOURCE_NOT_FOUND다.
        같은 사건의 기존 활동이 검토 완료 유형이 아니면 409 EVIDENCE_REVIEW_NOT_COMPLETED,
        저장된 검토 활동의 revision·snapshot ID·manifest digest와 현재 근거가 다르면
        409 EVIDENCE_REVIEW_MISMATCH다. 앞선 버전 오류는 활동 ID의 존재·소속에
        따라 달라지지 않는다. ACTIVE 보류는 ISSUANCE_HOLD_ACTIVE,
        예약 중은 REPORT_RENDER_IN_PROGRESS, STALE 승인/상태 조건 불일치는
        CASE_STATE_CONFLICT, 필수 필드 누락은 422 VALIDATION_FAILED다.
      parameters: [{$ref: '#/components/parameters/CaseId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CaseTransitionInput'}
            examples:
              evidenceNeeded:
                value: {toStatus: NEEDS_EVIDENCE, expectedCaseVersion: 4, reason: '추가 이미지 확인 필요'}
              noNewReportAfterStale:
                value:
                  toStatus: CLOSED
                  expectedCaseVersion: 8
                  reason: 'V2 근거 재검토를 완료하여 사건을 종료합니다.'
                  closureDisposition: NO_NEW_REPORT_AFTER_STALE
                  reviewActivityId: 99999999-9999-4999-8999-999999999999
                  reviewedEvidenceRevision: 2
                  noNewReportReason: '현재 근거로 추가 공식 보고서를 발급하지 않기로 결정했습니다.'
      responses:
        '200':
          description: 상태 변경과 활동 이력 기록 완료. CLOSED는 발급 완료/포기/기각/V2 재검토 후 신규 미발급을 closureDisposition으로 구분.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Case'}
              example:
                caseId: 11111111-1111-4111-8111-111111111111
                eventId: 33333333-3333-4333-8333-333333333333
                type: GRAPH_CLUSTER
                status: CLOSED
                caseVersion: 9
                evidenceRevision: 2
                hasActiveIssuanceHold: false
                currentReportVersionId: 44444444-4444-4444-8444-444444444444
                closureDisposition: NO_NEW_REPORT_AFTER_STALE
                closureReason: 'V2 근거 재검토를 완료하여 사건을 종료합니다.'
                closureEvidenceRevision: 2
                closureReviewActivityId: 99999999-9999-4999-8999-999999999999
                closureStaleApprovalDecisionId: 55555555-5555-4555-8555-555555555555
