openapi: 3.1.0
info:
  title: Track 1 Macro Cluster Analysis API
  version: 1.0.0
  description: >-
    Spring 서버가 예매처의 가명 티켓 데이터를 전달하고 Louvain 군집 분석 결과를 받는
    내부 API 계약입니다. riskScore는 조사 우선순위 점수이며 보정된 사기 확률이나
    과징금 계산값을 의미하지 않습니다. 이 API 버전에는 인증된 테넌트 컨텍스트가
    포함되어 있지 않으므로 단일 신뢰 데이터 범위에서만 사용해야 합니다. 다중 고객
    운영은 인증 및 테넌트 분리 작업이 끝날 때까지 운영 배포 대상이 아닙니다.
servers:
  - url: http://localhost:8000
    description: 로컬 FastAPI 분석 서버
paths:
  /api/v1/clusters/analyze:
    post:
      operationId: analyzeMacroClusters
      summary: 티켓별 가명 데이터의 매크로 의심 군집 분석
      description: >-
        요청의 tickets는 배열 순서가 아니라 accountId, reservationNo, eventId 조합으로
        연결합니다. 개인정보 원문을 보내지 않으며, 연결 신호는 고객사 전처리 단계에서
        생성한 테넌트·신호 종류별 결정적 HMAC-SHA256 토큰이어야 합니다. JSON 필드명은
        camelCase입니다. 이 버전은 인증된 테넌트 컨텍스트를 전달하지 않으므로 여러
        고객사의 그래프 데이터를 같은 분석 범위에 적재해서는 안 됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MacroAnalysisRequest'
            example:
              requestId: 2136558c-2326-4430-a46d-0793494e9b49
              tickets:
                - accountId: uid-1001
                  reservationNo: res-5001
                  eventId: event-2026-001
                  paymentHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  addressHash: null
                  deviceIdHash: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                  ipHash: null
      responses:
        '200':
          description: 분석 완료. 의심 군집이 없으면 clusters는 빈 배열입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MacroAnalysisResponse'
              example:
                requestId: 2136558c-2326-4430-a46d-0793494e9b49
                status: COMPLETED
                algorithm: LOUVAIN
                algorithmVersion: 1.0.0
                analyzedAt: '2026-10-08T10:15:30Z'
                clusters:
                  - clusterId: cluster-001
                    members:
                      - accountId: uid-1001
                        reservationNo: res-5001
                        eventId: event-2026-001
                      - accountId: uid-1002
                        reservationNo: res-5002
                        eventId: event-2026-001
                    paymentHashes:
                      - aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                    addressHashes: []
                    deviceIdHashes:
                      - bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                    ipHashes: []
                    riskScore: 0.91
        '422':
          description: 요청 필드 또는 연결 토큰 형식이 계약을 충족하지 않습니다.
        '500':
          description: 분석 처리에 실패했습니다. 정상적인 빈 군집 결과로 바꾸어 반환하지 않습니다.
components:
  schemas:
    MacroAnalysisRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - tickets
      properties:
        requestId:
          type: string
          format: uuid
          description: Spring이 생성하는 분석 요청 추적 ID
        tickets:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TicketInput'
    TicketInput:
      type: object
      additionalProperties: false
      required:
        - accountId
        - reservationNo
        - eventId
      properties:
        accountId:
          type: string
          minLength: 1
          maxLength: 128
          description: 고객사의 내부 계정 식별자. 이름·연락처 등 직접 식별 정보를 넣지 않습니다.
        reservationNo:
          type: string
          minLength: 1
          maxLength: 128
        eventId:
          type: string
          minLength: 1
          maxLength: 128
          description: 고객사 공연 목록에서 발급한 공연 식별자
        paymentHash:
          $ref: '#/components/schemas/JoinToken'
        addressHash:
          $ref: '#/components/schemas/JoinToken'
        deviceIdHash:
          $ref: '#/components/schemas/JoinToken'
        ipHash:
          $ref: '#/components/schemas/JoinToken'
      description: 네 가지 연결 토큰 중 하나 이상을 제공해야 합니다.
    JoinToken:
      type:
        - string
        - 'null'
      pattern: '^[0-9a-f]{64}$'
      description: 소문자 16진수 64자리의 테넌트·신호 종류별 결정적 HMAC-SHA256 토큰
    MacroAnalysisResponse:
      type: object
      additionalProperties: false
      required:
        - requestId
        - status
        - algorithm
        - algorithmVersion
        - analyzedAt
        - clusters
      properties:
        requestId:
          type: string
          format: uuid
        status:
          type: string
          const: COMPLETED
        algorithm:
          type: string
          const: LOUVAIN
        algorithmVersion:
          type: string
          minLength: 1
        analyzedAt:
          type: string
          format: date-time
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/MacroCluster'
    MacroCluster:
      type: object
      additionalProperties: false
      required:
        - clusterId
        - members
        - paymentHashes
        - addressHashes
        - deviceIdHashes
        - ipHashes
        - riskScore
      properties:
        clusterId:
          type: string
          minLength: 1
        members:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/ClusterMember'
        paymentHashes:
          type: array
          items:
            $ref: '#/components/schemas/NonNullJoinToken'
        addressHashes:
          type: array
          items:
            $ref: '#/components/schemas/NonNullJoinToken'
        deviceIdHashes:
          type: array
          items:
            $ref: '#/components/schemas/NonNullJoinToken'
        ipHashes:
          type: array
          items:
            $ref: '#/components/schemas/NonNullJoinToken'
        riskScore:
          type: number
          minimum: 0
          maximum: 1
          description: 조사 우선순위 점수. 통계적으로 보정된 사기 확률이 아닙니다.
    NonNullJoinToken:
      type: string
      pattern: '^[0-9a-f]{64}$'
    ClusterMember:
      type: object
      additionalProperties: false
      required:
        - accountId
        - reservationNo
        - eventId
      properties:
        accountId:
          type: string
          minLength: 1
          maxLength: 128
        reservationNo:
          type: string
          minLength: 1
          maxLength: 128
        eventId:
          type: string
          minLength: 1
          maxLength: 128
