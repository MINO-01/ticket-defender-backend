resilience4j:
  circuitbreaker:
    instances:
      fastApi:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - com.ticket.defender_core.adapter.out.api.FastApiResponseContractException

spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 101MB

ticket-defender:
  evidence-preservation:
    enabled: ${EVIDENCE_PRESERVATION_ENABLED:false}
    max-bytes: ${EVIDENCE_PRESERVATION_MAX_BYTES:20971520}
    storage:
      profile: ${EVIDENCE_PRESERVATION_STORAGE_PROFILE:UNCONFIGURED}
      endpoint: ${EVIDENCE_PRESERVATION_S3_ENDPOINT:}
      region: ${EVIDENCE_PRESERVATION_S3_REGION:us-east-1}
      bucket: ${EVIDENCE_PRESERVATION_S3_BUCKET:}
      access-key: ${EVIDENCE_PRESERVATION_S3_ACCESS_KEY:}
      secret-key: ${EVIDENCE_PRESERVATION_S3_SECRET_KEY:}
  evidence-integrity:
    max-bytes: ${EVIDENCE_INTEGRITY_MAX_BYTES:20971520}
  fan-report:
    enabled: ${FAN_REPORT_ENABLED:false}
    max-concurrent-intakes: ${FAN_REPORT_MAX_CONCURRENT_INTAKES:0}
    hmac-key-base64: ${FAN_REPORT_HMAC_KEY_BASE64:}
    retention-days: ${FAN_REPORT_RETENTION_DAYS:90}
    storage:
      endpoint: ${FAN_REPORT_S3_ENDPOINT:}
      region: ${FAN_REPORT_S3_REGION:us-east-1}
      bucket: ${FAN_REPORT_S3_BUCKET:}
      access-key: ${FAN_REPORT_S3_ACCESS_KEY:}
      secret-key: ${FAN_REPORT_S3_SECRET_KEY:}
      head-access-key: ${FAN_REPORT_S3_HEAD_ACCESS_KEY:}
      head-secret-key: ${FAN_REPORT_S3_HEAD_SECRET_KEY:}
  official-pdf:
    # This flag alone never authorizes operation; only synthetic isolated mode is currently accepted.
    enabled: ${OFFICIAL_PDF_ENABLED:false}
    operational-mode: ${OFFICIAL_PDF_OPERATIONAL_MODE:DISABLED}
    max-bytes: ${OFFICIAL_PDF_MAX_BYTES:10485760}
    # Synthetic isolated initial value; not an approved operating SLA.
    attempt-lease: ${OFFICIAL_PDF_ATTEMPT_LEASE:PT5M}
    storage:
      endpoint: ${OFFICIAL_PDF_S3_ENDPOINT:}
      region: ${OFFICIAL_PDF_S3_REGION:us-east-1}
      bucket: ${OFFICIAL_PDF_S3_BUCKET:}
      access-key: ${OFFICIAL_PDF_S3_ACCESS_KEY:}
      secret-key: ${OFFICIAL_PDF_S3_SECRET_KEY:}
