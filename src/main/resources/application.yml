resilience4j:
  circuitbreaker:
    instances:
      fastApi:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - com.ticket.defender_core.adapter.out.api.FastApiResponseContractException

spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 101MB

ticket-defender:
  fan-report:
    enabled: ${FAN_REPORT_ENABLED:false}
    hmac-key-base64: ${FAN_REPORT_HMAC_KEY_BASE64:}
    retention-days: ${FAN_REPORT_RETENTION_DAYS:90}
    storage:
      endpoint: ${FAN_REPORT_S3_ENDPOINT:}
      region: ${FAN_REPORT_S3_REGION:us-east-1}
      bucket: ${FAN_REPORT_S3_BUCKET:}
      access-key: ${FAN_REPORT_S3_ACCESS_KEY:}
      secret-key: ${FAN_REPORT_S3_SECRET_KEY:}
